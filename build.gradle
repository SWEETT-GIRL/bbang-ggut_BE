import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

description = 'Croissant'

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    group = 'sweetgirl'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    // Boot 플러그인을 쓰지 않는 라이브러리 모듈(core)도 같은 Boot 버전 BOM 으로 맞춘다
    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        // Boot 4 는 슬라이스 테스트(@DataJpaTest 등)가 별도 스타터다. 랩 PG 스키마 검증(@Tag lab)과 @DataJpaTest 용
        testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
        testRuntimeOnly 'com.h2database:h2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        // 기존 프로필과 v2 전체 기동 컨텍스트를 함께 검사할 때 기본 512MB를 넘는다.
        maxHeapSize = '1g'
        useJUnitPlatform {
            // 'lab' 태그 = 로컬 랩 PG(docker-compose.lab-postgres.yml, 운영 덤프 복제본)에 붙는 통합 테스트.
            // CI/기본 빌드에서는 제외하고, 랩이 떠 있을 때 ./gradlew test -PlabTests 로 돌린다.
            if (!project.hasProperty('labTests')) {
                excludeTags 'lab'
            }
            // 'llm' 태그 = 진짜 LLM API 를 부르는 측정 테스트(#662). 호출마다 실제 비용이 나가고 키가 있어야 돈다.
            // 키를 환경 변수로 주고 ./gradlew test -PllmTests --tests "*ReasonLlmLatencyMeasurementTest" 로 돌린다.
            if (!project.hasProperty('llmTests')) {
                excludeTags 'llm'
            }
            // 'openapi' 태그 = API 명세(openapi.json)를 api/build/openapi 에 뽑는 테스트. 전체 컨텍스트를 하나 더 띄우므로 기본 test 에선 빼고,
            // 앱 타입 검사가 필요할 때 ./gradlew :api:test -PopenapiExport --tests "*OpenApiSpecExportTest" 로 돌린다.
            if (!project.hasProperty('openapiExport')) {
                excludeTags 'openapi'
            }
        }
    }

    spotless {
        java {
            eclipse().configFile(rootProject.file('config/naver-eclipse-formatter.xml'))
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    checkstyle {
        toolVersion = '10.12.1'
        configFile = rootProject.file('config/checkstyle/naver-checkstyle-rules.xml')
        configProperties = ['suppressionFile': rootProject.file('config/checkstyle/naver-checkstyle-suppressions.xml').path]
        ignoreFailures = false
        maxWarnings = 0
    }

    tasks.named('compileJava') {
        dependsOn rootProject.tasks.named('installGitHooks')
    }

    // Boot 플러그인이 붙이던 -parameters 를 라이브러리 모듈(core)에도 붙인다.
    // 없으면 @Query 의 :name 바인딩·생성자 바인딩처럼 파라미터 이름을 읽는 곳이 런타임에 깨진다.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }
}

tasks.register('installGitHooks', Exec) {
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}
