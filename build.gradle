plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'sweetgirl'
version = '0.0.1-SNAPSHOT'
description = 'Croissant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 자동완성 캐시 — 배포(blue/green 전환)로 JVM 이 바뀌어도 남아야 해서 앱 밖에 둔다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // @Timed 등 애노테이션 기반 계측용 (Boot 4부터 starter-aop → starter-aspectj)
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'

    // Metrics & Monitoring
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Database & Persistence
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    //OAuth
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JSON & JWT
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.2'


    //AWS S3
    implementation 'software.amazon.awssdk:s3:2.42.41'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Boot 4 는 슬라이스 테스트(@DataJpaTest 등)가 별도 스타터다. 랩 PG 스키마 검증(@Tag lab)과 @DataJpaTest 용
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // 'lab' 태그 = 로컬 랩 PG(docker-compose.lab-postgres.yml, 운영 덤프 복제본)에 붙는 통합 테스트.
        // CI/기본 빌드에서는 제외하고, 랩이 떠 있을 때 ./gradlew test -PlabTests 로 돌린다.
        if (!project.hasProperty('labTests')) {
            excludeTags 'lab'
        }
        // 'llm' 태그 = 진짜 LLM API 를 부르는 측정 테스트(#662). 호출마다 실제 비용이 나가고 키가 있어야 돈다.
        // 키를 환경 변수로 주고 ./gradlew test -PllmTests --tests "*ReasonLlmLatencyMeasurementTest" 로 돌린다.
        if (!project.hasProperty('llmTests')) {
            excludeTags 'llm'
        }
        // 'openapi' 태그 = API 명세(openapi.json)를 build/openapi 에 뽑는 테스트. 전체 컨텍스트를 하나 더 띄우므로 기본 test 에선 빼고,
        // 앱 타입 검사가 필요할 때 ./gradlew test -PopenapiExport --tests "*OpenApiSpecExportTest" 로 돌린다.
        if (!project.hasProperty('openapiExport')) {
            excludeTags 'openapi'
        }
    }
}

spotless {
    java {
        eclipse().configFile('config/naver-eclipse-formatter.xml')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.12.1'
    configFile = file('config/checkstyle/naver-checkstyle-rules.xml')
    configProperties = ['suppressionFile': 'config/checkstyle/naver-checkstyle-suppressions.xml']
    ignoreFailures = false
    maxWarnings = 0
}

tasks.register('installGitHooks', Exec) {
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}

tasks.named('compileJava') {
    dependsOn 'installGitHooks'
}
