services:
  scouter-server:
    image: scouterapm/scouter-server:2.20.0
    container_name: scouter-server
    restart: always
    ports:
      - "${SCOUTER_SERVER_PORT:-6100}:6100"
      - "${SCOUTER_SERVER_PORT:-6100}:6100/udp"
      - "${SCOUTER_WEB_PORT:-6188}:6188"
    volumes:
      - scouter-server-data:/home/scouter-server/sc-server/database

volumes:
  scouter-server-data:
