# 빌드 속도 설정 — CI(ubuntu-latest, 4 vCPU)와 로컬에 함께 적용된다.
# parallel: core·api·batch 의 컴파일·체크스타일·테스트 태스크를 동시에 돌린다(기본은 모듈 순차).
# caching: 입력이 같은 태스크 결과를 재사용한다. CI 에서는 setup-gradle 이 Gradle User Home 째로 저장·복원한다.
# jvmargs: 병렬로 돌 때 기본 512MB 로는 체크스타일·컴파일이 함께 뜨면 부족하다.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g
