# bastion에 배치하는 prod 리버스 프록시 설정.
# 설치 위치: /etc/nginx/conf.d/bbang-ggut.cloud.conf
#
# upstream 정의는 이 파일에 없다. switch-upstream.sh 가 생성하는
# /etc/nginx/conf.d/bbang-upstream.conf 에 있으며, 배포 때마다 blue/green 으로 교체된다.

# ALB가 하던 X-Forwarded-For 체인 처리를 대신한다.
# bastion이 인터넷과 직접 맞닿으므로 $remote_addr 이 곧 클라이언트 IP다.
map $http_x_forwarded_for $client_ip {
    default $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name bbang-ggut.cloud;

    # certbot HTTP-01 챌린지 — 인증서 갱신에 필요하므로 리다이렉트보다 먼저 둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bbang-ggut.cloud;

    ssl_certificate     /etc/letsencrypt/live/bbang-ggut.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbang-ggut.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # 업로드는 S3 프리사인드 URL로 나가므로 큰 본문이 오지 않는다.
    # JSON 본문 여유만 둔다 (Nginx 기본값 1M은 일부 벌크 요청에서 빠듯하다).
    client_max_body_size 10m;

    # 앱이 기동 중이거나 전환 직후여도 Nginx가 먼저 죽지 않도록 여유 있게 잡는다.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # HSTS — 앱이 HTTPS로만 서비스되는 것이 확정된 뒤에 켠다.
    # 한 번 브라우저에 캐시되면 되돌리기 어려우므로 전환 안정화 후 주석을 해제할 것.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://bbang_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 배포 중 대상이 잠깐 응답하지 않아도 502를 그대로 내보내지 않고 재시도한다.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 코스 신호 STOMP(WebSocket). location / 은 Connection "" 로 keep-alive 를 쓰므로 그대로면 업그레이드가 안 된다 —
    # 여기서만 Upgrade/Connection 을 넘기고, 유휴 소켓이 끊기지 않게 read timeout 을 길게 둔다(앱 하트비트 25초).
    # 전환(blue/green) 때 옛 스택의 소켓은 함께 끊긴다 — 앱이 지터(0~3초) 뒤 재연결하고 그 사이는 폴링이 메운다.
    location /ws {
        proxy_pass http://bbang_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # actuator는 관리 포트(8081/8083)로만 노출되며 외부에 열지 않는다.
    location /actuator {
        return 404;
    }
}
