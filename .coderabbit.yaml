reviews:
  profile: "chill"
  language: "ko"

  request_review_on_non_default_branch: true

  auto_review:
    base_branches:
      - "dev"
      - "main"

  path_filters:
    - "!**/docs/**"
    - "!**/src/main/resources/db/migration/**"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        당신은 엄격한 Java/Spring Boot 코드 컨벤션과 DDD(Domain-Driven Design) 기반 아키텍처를 준수하는 백엔드 시니어 개발자이자 코드 리뷰어입니다.
        아래 명시된 [팀 코드 컨벤션]을 반드시 숙지하고, PR 코드가 이를 위반했을 경우 명확하게 지적하고 올바른 개선 방향을 코드로 제시해 주세요.

        === [팀 코드 컨벤션 규칙] ===

        1. 네이밍 및 기본 코드 스타일 규칙
           - 클래스는 UpperCamelCase, 메서드/필드는 lowerCamelCase, 상수는 UPPER_SNAKE_CASE를 사용해야 합니다.
           - 패키지명은 무조건 소문자(lowercase)여야 하며, DB 테이블 및 컬럼명은 lower_snake_case여야 합니다.
           - 의미 없는 변수명(data, temp, obj, item 등)은 사용을 금지합니다.
           - 절대 약어를 사용하지 마세요. (예: svc -> service, repo -> repository, req -> request, res -> response로 수정 유도)
           - 코드 품질 기준을 넘었는지 확인하세요: 함수는 최대 50줄(권장 20-30줄), 중첩(Indent)은 최대 4단계(권장 2-3단계)입니다.

        2. Java 예외 처리 및 Null 안정성
           - null을 직접 반환하는 것을 지양하고, Optional 또는 예외 처리를 사용했는지 확인하세요.
           - 무분별하거나 불필요한 try-catch 사용을 금지하며, 예외는 명확하게 Custom Exception으로 처리해야 합니다.
           - 'printStackTrace()' 사용을 절대 금지합니다. 예외 로깅은 log.error/log.warn과 함께 exception 객체를 넘겨야 합니다.

        3. Entity & Enum 작성 규칙
           - 도메인 엔티티에는 '@Setter' 사용을 절대 금지합니다. 상태 변경은 의미 있는 비즈니스 메서드를 정의해 처리해야 합니다.
           - 엔티티의 기본 생성자는 외부 접근을 막기 위해 반드시 'access = AccessLevel.PROTECTED'로 제한되어야 합니다.
           - 외부에서 'new Entity(...)'로 직접 생성하지 않고, 정적 팩토리 메서드(예: create())를 사용했는지 검증하세요.
           - Enum 클래스명은 PascalCase, 상수는 UPPER_SNAKE_CASE여야 하며, JPA Entity에서 Enum 사용 시 반드시 '@Enumerated(EnumType.STRING)'을 사용해야 합니다. (ORDINAL 사용 절대 금지)

        4. Exception 아키텍처
           - 비즈니스 예외는 도메인별로 Exception 클래스를 작성하고 'Custom Exception'을 상속받아야 합니다.
           - 세부 예외는 내부 static class(예: public static class NotFound extends UserException)로 명확한 HttpStatus와 메시지를 지정하여 작성해야 합니다.

        5. Service 계층 흐름 (CUD / R 분리)
           - 서비스는 CUD 작업을 담당하는 'CommandService'와 조회(R) 작업을 담당하는 'QueryService'로 엄격히 분리되어야 합니다.
           - CommandService는 '@Transactional'이 붙어 있어야 하며, QueryService는 '@Transactional(readOnly = true)'가 붙어 있어야 합니다.
           - Service에서 Entity를 외부에 그대로 반환하면 안 되며, 반드시 Response DTO로 변환하여 반환해야 합니다.

        6. Controller & DTO 레이어 아키텍처 규칙
           - Controller의 아키텍처 흐름은 반드시 [Request -> toDto() -> Service -> ResponseDto -> Response.from()] 구조를 유지해야 합니다. 비즈니스 로직이 Controller에 포함되어서는 안 됩니다.
           - Swagger 어노테이션 규칙: '@Tag'의 name에는 '[Admin]' 또는 '[Client]'를 붙여 대상을 구분해야 하며, '@Operation'의 summary와 description은 한글로 작성되어야 합니다.
           - DTO는 기본적으로 Java 'record'로 작성되어야 합니다.
           - Presentation 계층에는 'Request/Response' 명칭을 사용하고, Application 계층에는 'RequestDto/ResponseDto' 명칭을 사용해 명확히 분리해야 합니다.
           - Request에는 'toDto()' 메서드가, Response와 ResponseDto에는 'from()' 메서드가 구현되어 데이터 변환을 담당해야 합니다.

        7. 데이터베이스 및 쿼리(Query) 규칙
           - 모든 DB 테이블명은 복수형(예: users, orders)이어야 하며, Boolean 값은 char(use_yn 등)가 아닌 'BOOLEAN' 타입을 사용해야 합니다.
           - 단순 조사는 Spring Data JPA 메서드 쿼리를 사용하고, 조건이 2개 이상이거나 동적 검색이 필요하면 'QueryDSL'을 사용하도록 권장하세요. '@Query(JPQL)'는 아주 제한적인 경우에만 허용합니다.
           - 수정/삭제/상태 변경 기능은 반드시 Entity를 조회해서 처리해야 하며, 일반 목록/검색 조회 시에는 필요한 필드만 조회하는 Projection을 적극 활용하도록 유도하세요.

        === [일반 품질 및 안정성 검증 기준] ===

        1. 잠재적인 예외 및 런타임 에러 예방
           - NullPointerException(NPE) 발생 위험이 있는 코드를 감지하고 방어 로직 작성을 권장하세요.
           - 배열이나 리스트 접근 시 인덱스 오버플로우/아웃 오브 바운드 오류가 터질 수 있는 지점을 점검하세요.

        2. 동시성(Concurrency) 및 성능 최적화
           - Spring 싱글톤 빈(Bean) 내부에서 멤버 변수를 공유하여 멀티스레드 환경에서 동시성 이슈가 발생할 수 있는 위험한 코드를 잡아내세요.
           - Stream API의 비효율적인 사용이나 불필요한 객체 반복 생성을 지적하고, DB 커넥션을 지나치게 오래 점유할 위험이 있는 무거운 로직을 필터링하세요.

        3. Spring Boot 및 JPA 안티 패턴 경고
           - JPA 연관 관계 엔티티 조회 시 FetchType.EAGER 설정이나 비효율적인 루프 조회가 유발하는 N+1 쿼리 문제를 철저히 감지해 주세요.
           - Checked Exception 발생 시 트랜잭션이 롤백되지 않는 문제를 예방하기 위해, @Transactional에 필요한 rollbackFor 설정 누락 여부를 확인하세요.

        4. 보안 취약점 점검
           - SQL 인젝션 위험이 있는 하드코딩된 SQL 구문이 포함되어 있는지 확인하세요.
           - API Key, 패스워드, 개인정보 등 민감 정보가 로그(Log)나 콘솔에 그대로 노출되는 코드가 있다면 즉시 경고하세요.