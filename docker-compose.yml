version: '3.8'
services:
  app:
    image: ${DOCKER_USERNAME}/bbang-ggut-be:${IMAGE_TAG:-latest}
    container_name: bbang-ggut-be
    restart: always
    # graceful shutdown(20s) 이 끝나기 전에 SIGKILL이 날아가지 않도록 여유를 둔다.
    stop_grace_period: 30s
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PROD_SERVER_IP: "https://bbang-ggut.cloud"
      STAGING_SERVER_IP: "https://bbang-ggut.site"
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      ENCRYPT_SECRET_KEY: ${ENCRYPT_SECRET_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      SLACK_ERROR_WEBHOOK_URL: ${SLACK_ERROR_WEBHOOK_URL}
      SLACK_REPORT_WEBHOOK_URL: ${SLACK_REPORT_WEBHOOK_URL}
      SLACK_ABUSE_WEBHOOK_URL: ${SLACK_ABUSE_WEBHOOK_URL}
      AWS_REGION: ${AWS_REGION}
      OPENSEARCH_REGION: ${OPENSEARCH_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      POSTHOG_API_KEY: ${PROD_POSTHOG_API_KEY}
      OPENSEARCH_DEBUG_LOGGING: ${OPENSEARCH_DEBUG_LOGGING:-INFO}
      PERF_DASHBOARD_ENABLED: ${PERF_DASHBOARD_ENABLED:-false}
      PERF_DASHBOARD_ACCESS_KEY: ${PERF_DASHBOARD_ACCESS_KEY:-}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}

    ports:
      - "8080:8080"
      - "6100:6100"
      # actuator 관리 포트 — 같은 VPC의 Prometheus 스크랩 전용.
      # 인증이 없으므로 반드시 보안그룹 인바운드를 Prometheus 인스턴스 SG로 제한한다.
      - "${MANAGEMENT_PORT:-8081}:${MANAGEMENT_PORT:-8081}"
