bind 0.0.0.0
# 인증 없이 외부에 잘못 노출되는 것을 막는 보호 기능. 보안그룹과 ACL을 대신하지 않는다.
protected-mode yes
# Redis가 연결을 기다리는 컨테이너 내부 포트.
port 6379
# Redis를 포그라운드로 실행해 Docker가 프로세스를 관리하도록 한다.
daemonize no
# 로그를 파일 대신 표준 출력으로 보내 docker compose logs로 확인한다.
logfile ""
# AOF와 RDB 파일을 저장하는 기준 디렉터리. Compose의 영구 볼륨에 연결되어 있다.
dir /data
# CD가 생성한 사용자 권한과 비밀번호 해시를 읽는다.
aclfile /usr/local/etc/redis/users.acl

# 메모리 사용량이 이 기준에 도달하면 아래 정책으로 키를 삭제한다.
# Redis 전체 프로세스의 엄격한 상한은 아니다. AOF 버퍼, 저장 작업 등은 추가 메모리를 쓴다.
# 복제본이 t4g.small(2GB) 서버에 초안 Redis·감시자와 같이 뜨므로 512MB로 낮췄다. 컨테이너 상한은 768MiB.
maxmemory 512mb
# TTL 유무와 관계없이 최근에 덜 사용한 키를 골라 삭제한다.
# DB에서 다시 가져올 수 있는 캐시 용도 전제. 영구 보관할 데이터에는 별도 정책이 필요하다.
maxmemory-policy allkeys-lru

# 영속성 방식 1: AOF. 데이터를 변경하는 명령을 기록한다.
appendonly yes
# 변경 기록의 디스크 동기화를 보통 1초마다 수행한다.
# 매초 전체 데이터를 저장한다는 뜻은 아니다. 장애 시 최근 약 1초 변경은 유실될 수 있다.
appendfsync everysec

# 영속성 방식 2: RDB. 특정 시점의 메모리 데이터 전체를 스냅샷으로 저장한다.
# 아래 조건은 마지막 성공한 스냅샷 이후의 경과 시간과 변경 횟수다.
# 세 조건 중 하나라도 충족하면 백그라운드 저장을 수행한다.
# 900초(15분) 이상 경과 + 변경 1회 이상.
save 900 1
# 300초(5분) 이상 경과 + 변경 10회 이상.
save 300 10
# 60초(1분) 이상 경과 + 변경 10,000회 이상.
save 60 10000

# 복제·Sentinel 용 — CD 가 서버마다 만든다(masteruser/masterauth, replica-announce-ip, 복제본이면 replicaof).
# 초안 Redis 와 같은 방식이다. 읽기 전용 마운트라 Sentinel 의 CONFIG REWRITE 는 실패하지만 REPLICAOF 는 적용된다.
include /usr/local/etc/redis/replication-cache.conf
