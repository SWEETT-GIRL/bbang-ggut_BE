name: sweetgirl-prod-redis

# 역할(profile)로 한 파일을 세 서버에 쓴다. deploy.sh <role> 이 --profile 로 고른다.
#   master   : 캐시 redis + 초안 redis-draft(마스터) + 감시자          (ec2-sweetgirl-prod-redis-kafka-1)
#   replica  : 초안 redis-draft(복제본) + 감시자                      (ec2-sweetgirl-prod-redis-2)
#   sentinel : 감시자만                                                (ec2-sweetgirl-prod-redis-3)
# 마스터·복제본의 차이는 CD 가 서버마다 만들어 주는 replication.conf(replicaof 유무)뿐이다.
services:
  redis:
    profiles: [master]
    image: redis:7.4.11-bookworm
    platform: linux/arm64
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
      - redis-data:/data
    mem_limit: 1536m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "redis-cli --user health --pass '' --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 메모 초안 전용. 저장 전 글의 원본이라 캐시와 메모리 규칙을 나눈다.
  redis-draft:
    profiles: [master, replica]
    image: redis:7.4.11-bookworm
    platform: linux/arm64
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - "6380:6380"
    volumes:
      - ./redis-draft.conf:/usr/local/etc/redis/redis.conf:ro
      # CD 가 서버마다 만든다 — masteruser/masterauth, replica-announce-ip, 복제본이면 replicaof. Git 에 없다.
      - ./replication.conf:/usr/local/etc/redis/replication.conf:ro
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
      - redis-draft-data:/data
    mem_limit: 384m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "redis-cli -p 6380 --user health --pass '' --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 초안 Redis 감시자. 세 서버에 하나씩, quorum 2. 설정 파일을 스스로 고쳐 쓰므로 템플릿을 /data 로 복사해 띄운다.
  # host 네트워크 — 감시자끼리 서로의 주소를 알려야 해서 컨테이너 IP 가 아닌 서버 IP 로 떠야 한다.
  redis-draft-sentinel:
    profiles: [master, replica, sentinel]
    image: redis:7.4.11-bookworm
    platform: linux/arm64
    restart: unless-stopped
    network_mode: host
    command: [sh, -c, "cp /sentinel-template.conf /data/sentinel.conf && exec redis-sentinel /data/sentinel.conf"]
    volumes:
      - ./sentinel.conf:/sentinel-template.conf:ro
      - redis-draft-sentinel-data:/data
    mem_limit: 128m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "redis-cli -p 26380 ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    external: true
    name: sweetgirl-prod-redis-data
  redis-draft-data:
    external: true
    name: sweetgirl-prod-redis-draft-data
  redis-draft-sentinel-data:
    external: true
    name: sweetgirl-prod-redis-draft-sentinel-data
