name: sweetgirl-prod-redis

services:
  redis:
    image: redis:7.4.11-bookworm
    platform: linux/arm64
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
      - redis-data:/data
    mem_limit: 1536m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "redis-cli --user health --pass '' --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    external: true
    name: sweetgirl-prod-redis-data
