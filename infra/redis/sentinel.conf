# 초안 Redis Sentinel 템플릿. CD 가 __ANNOUNCE_IP__ · __MASTER_HOST__ · __REPLICATION_PASSWORD__ 를 서버마다 채운다.
# 마스터 이름 draft · quorum 2 · 5초 무응답이면 down 판정 → 승격(설계 결정 12). min-replicas-to-write 는 켜지 않는다.
port 26380
bind 0.0.0.0
# 감시자에는 비밀번호가 없다(앱 쪽 Lettuce 설정이 감시자 비밀번호를 쓰지 않는다). 26380 은 보안그룹으로만 막는다 — Redis SG 자신과 WAS SG.
protected-mode no
daemonize no
logfile ""
dir /data
sentinel announce-ip __ANNOUNCE_IP__
sentinel announce-port 26380
sentinel resolve-hostnames yes
sentinel announce-hostnames no
sentinel monitor draft __MASTER_HOST__ 6380 2
# 마스터·복제본에 붙을 때 쓰는 제한 계정(users.acl 의 sentinel). 앱 비밀번호가 아니다.
sentinel auth-user draft sentinel
sentinel auth-pass draft __REPLICATION_PASSWORD__
sentinel down-after-milliseconds draft 5000
sentinel failover-timeout draft 10000
sentinel parallel-syncs draft 1
