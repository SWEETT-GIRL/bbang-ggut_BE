name: CD - Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=prod-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application-prod.properties
        run: |
          cat > src/main/resources/application-prod.properties << 'EOF'
          spring.datasource.url=${DB_URL}
          spring.datasource.username=${DB_USERNAME}
          spring.datasource.password=${DB_PASSWORD}
          spring.datasource.driver-class-name=org.postgresql.Driver

          spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
          spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
          spring.security.oauth2.client.registration.kakao.redirect-uri=http://${PROD_SERVER_IP}:8080/api/v1/oauth2/kakao
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          jwt.secret=${JWT_SECRET}
          jwt.access-token-expiry=3600000
          jwt.refresh-token-expiry=1209600000

          firebase.config.path=firebase/firebase-service-account.json

          oauth2.front-redirect-uri=bbanggut://permission-location

          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:latest

      - name: Upload docker-compose to Production EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          source: docker-compose.yml
          target: ~/app

      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          script: |
            cd ~/app

            cat > .env << 'EOF'
            DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}
            SPRING_PROFILE=prod
            DB_URL=${{ secrets.PROD_DB_URL }}
            DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PROD_SERVER_IP=${{ secrets.PROD_SERVER_IP }}
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f
