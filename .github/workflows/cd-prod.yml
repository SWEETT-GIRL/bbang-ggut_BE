name: CD - Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=prod-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application-prod.properties
        run: |
          cat > src/main/resources/application-prod.properties << 'EOF'
          spring.datasource.url=${DB_URL}
          spring.datasource.username=${DB_USERNAME}
          spring.datasource.password=${DB_PASSWORD}
          spring.datasource.driver-class-name=org.postgresql.Driver

          spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
          spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
          spring.security.oauth2.client.registration.kakao.redirect-uri=https://bbang-ggut.cloud/api/v1/oauth2/kakao
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          kakao.api.base-url=https://dapi.kakao.com
          kakao.api.key=${KAKAO_API_KEY}

          google.places.api-key=${GOOGLE_PLACES_API_KEY}

          jwt.secret=${JWT_SECRET}
          jwt.access-token-expiry=1800000
          jwt.refresh-token-expiry=5184000000

          firebase.config.path=firebase/firebase-service-account.json

          oauth2.front-redirect-uri=bbanggut://permission-location

          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

          spring.flyway.enabled=true
          spring.flyway.locations=classpath:db/migration
          spring.flyway.baseline-on-migrate=true
          spring.flyway.baseline-version=20260609000000
          spring.flyway.baseline-description=Existing schema before nationwide ranking tables
          spring.flyway.out-of-order=true
          
          aws.region=ap-northeast-2
          aws.s3.bucket=${{ secrets.PROD_AWS_S3_BUCKET }}
          opensearch.endpoint=${{ secrets.PROD_OPENSEARCH_ENDPOINT }}
          opensearch.region=ap-southeast-2

          posthog.api-key=${{secrets.PROD_POSTHOG_API_KEY}}
          posthog.host=https://us.i.posthog.com

          # AES-256 암호화 키
          encrypt.secret-key=${ENCRYPT_SECRET_KEY}

          # Discord 에러 알림 웹훅
          discord.webhook.url=${DISCORD_WEBHOOK_URL}
          discord.notification.report-webhook-url=${DISCORD_REPORT_WEBHOOK_URL}
          discord.notification.abuse-webhook-url=${DISCORD_ABUSE_WEBHOOK_URL}

          # Lambda 콜백 인증 키
          lambda.callback.secret-key=${{secrets.LAMBDA_CALLBACK_SECRET_KEY}}

          # 성능 측정 대시보드
          perf.dashboard.enabled=${PERF_DASHBOARD_ENABLED:false}
          perf.dashboard.access-key=${PERF_DASHBOARD_ACCESS_KEY:}
          
          # OpenSearch 디버그 로그 활성화 (추가된 부분)
          logging.level.org.opensearch.client=${OPENSEARCH_DEBUG_LOGGING:INFO}
          logging.level.sweetgirl.croissant.external.opensearch=${OPENSEARCH_DEBUG_LOGGING:INFO}
          EOF

      - name: Create Firebase service account file
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources/firebase
          echo "$FIREBASE_JSON" > src/main/resources/firebase/firebase-service-account.json

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:latest

      - name: Upload docker-compose to Production EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          source: docker-compose.yml
          target: ~/app

      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_KEY }}
          script: |
            cd ~/app

            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}" >> .env
            echo "SPRING_PROFILE=prod" >> .env
            echo "DB_URL=${{ secrets.PROD_DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "PROD_SERVER_IP=${{ secrets.PROD_SERVER_IP }}" >> .env
            echo "KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }}" >> .env
            echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
            echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env
            echo "AWS_REGION=ap-northeast-2" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.PROD_AWS_S3_BUCKET }}" >> .env
            echo "PROD_POSTHOG_API_KEY=${{ secrets.PROD_POSTHOG_API_KEY }}" >> .env
            echo "ENCRYPT_SECRET_KEY=${{ secrets.ENCRYPT_SECRET_KEY }}" >> .env
            echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL_PROD }}" >> .env
            echo "DISCORD_REPORT_WEBHOOK_URL=${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}" >> .env
            echo "DISCORD_ABUSE_WEBHOOK_URL=${{ secrets.DISCORD_ABUSE_WEBHOOK_URL }}" >> .env
            echo "LAMBDA_CALLBACK_SECRET_KEY=${{ secrets.LAMBDA_CALLBACK_SECRET_KEY }}" >> .env
            echo "PERF_DASHBOARD_ENABLED=${{ secrets.PERF_DASHBOARD_ENABLED }}" >> .env
            echo "PERF_DASHBOARD_ACCESS_KEY=${{ secrets.PERF_DASHBOARD_ACCESS_KEY }}" >> .env
            echo "OPENSEARCH_DEBUG_LOGGING=${{ secrets.OPENSEARCH_DEBUG_LOGGING }}" >> .env

            docker compose pull
            docker compose up -d
            docker image prune -a -f

      - name: Get PR title
        id: pr_info
        run: |
          PR_TITLE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""' 2>/dev/null || echo "")
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="${{ github.event.head_commit.message }}"
          fi
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success()
        run: |
          jq -n \
            --arg pr "${{ steps.pr_info.outputs.title }}" \
            --arg tag "${{ steps.tag.outputs.IMAGE_TAG }}" \
            '{embeds: [{
              "title": "🚀 배포 완료 [PROD]",
              "color": 3066993,
              "fields": [
                {"name": "PR", "value": $pr, "inline": false},
                {"name": "Image Tag", "value": $tag, "inline": true},
                {"name": "Branch", "value": "main", "inline": true}
              ]
            }]}' | \
          curl -s -X POST "${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL_PROD }}" \
            -H "Content-Type: application/json" \
            -d @-
