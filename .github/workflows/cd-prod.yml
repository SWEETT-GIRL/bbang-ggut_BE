name: CD - Production

on:
  push:
    branches: [ main ]
  # 코드 변경 없이 설정만 바꿔 다시 띄울 때 — Repository variables 를 고친 뒤 여기서 수동 실행한다.
  # 이게 없으면 변수를 바꿔도 다음 main 머지까지 반영되지 않는다(장애 때 되돌릴 방법이 없다는 뜻이다).
  workflow_dispatch:

# 같은 EC2의 .env·Compose 파일과 Docker 저장소를 동시에 변경하지 않는다.
# 실행 중인 배포는 끝내고 다음 배포를 시작한다 — 겹치면 둘 다 같은 '새 색'을 고르고,
# 한쪽의 롤백·prune 이 다른 쪽의 pull·기동을 밟는다(#941·#939 연속 머지에서 pull 이 깨졌다).
concurrency:
  group: cd-prod
  cancel-in-progress: false

# 배포 알림의 PR 타이틀 조회(gh api …/pulls)에 필요 — 없으면 403으로 에러 본문이 제목에 섞인다
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=prod-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application-prod.properties
        run: |
          cat > src/main/resources/application-prod.properties << 'EOF'
          spring.datasource.url=${DB_URL}
          spring.datasource.username=${DB_USERNAME}
          spring.datasource.password=${DB_PASSWORD}
          spring.datasource.driver-class-name=org.postgresql.Driver

          spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
          spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
          spring.security.oauth2.client.registration.kakao.redirect-uri=https://bbang-ggut.cloud/api/v1/oauth2/kakao
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          spring.security.oauth2.client.registration.naver.client-id=${NAVER_LOGIN_CLIENT_ID}
          spring.security.oauth2.client.registration.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET}
          spring.security.oauth2.client.registration.naver.redirect-uri=https://bbang-ggut.cloud/api/v1/oauth2/naver
          spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.naver.client-name=Naver
          spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
          spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
          spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
          spring.security.oauth2.client.provider.naver.user-name-attribute=response

          kakao.api.base-url=https://dapi.kakao.com
          kakao.api.key=${KAKAO_API_KEY}

          google.places.api-key=${GOOGLE_PLACES_API_KEY}

          gemini.api.key=${GEMINI_API_KEY}

          # 취향 점수를 무엇으로 낼지 (#783) — AXIS 는 4축 코사인, LABEL 은 라벨 아홉 값 코사인.
          # Repository variables 의 PROD_TASTE_SOURCE 로 켜고 끈다(Secrets 아님 — 숨길 값이 아니고,
          # Secret 이면 배포 로그에서 ***로 가려져 어느 쪽으로 떴는지 확인할 수 없다).
          # 변수가 없으면 AXIS 라, 지워져도 기존 동작으로 돌아간다.
          #
          # LABEL 로 켜도 라벨을 못 쓰는 회원은 축으로 돈다 — 가게 라벨 적재 전이거나 프로필 배치 전이어도
          # 개인화가 사라지지 않는다. 다만 그 상태로 켜면 아무도 라벨로 돌지 않으므로, 켜기 전에
          # store_recommendation_feature 적재와 profiles/refresh 를 먼저 끝낸다.
          recommendation.score.taste-source=${{ vars.PROD_TASTE_SOURCE || 'AXIS' }}

          # 이유 문장 LLM 실험(#662) — 없으면 그 벤더만 실험에서 빠진다
          openai.api.key=${OPENAI_API_KEY:}
          anthropic.api.key=${CLAUDE_API_KEY:}

          # 앱이 부르는 이유 문장 LLM(#764). Repository variables 의 PROD_REASON_LLM 로 켜고 끈다.
          # 변수가 없으면 false 라, 이 줄이 들어와도 머지만으로는 호출이 나가지 않는다 — 켜는 것은 따로 판단한다.
          #
          # 켜기 전에 볼 것:
          #  - 하루 상한(daily-call-limit, 기본 200)은 인스턴스 메모리 카운터다. 배포할 때마다 0 으로 돌아가므로
          #    하루에 여러 번 배포하면 200 을 넘길 수 있다. 여러 대로 늘리면 공유 저장소로 옮겨야 한다.
          #  - 운영은 menu.classification.enabled=false 라 Gemini 무료 500회/일을 이 경로가 거의 독점한다.
          #  - 35자를 넘는 줄은 룰 문장으로 되돌린다(줄 단위). 그 수는 "이유 문장 길이 초과" 로그로 본다 —
          #    켜 놓고 그 값이 크면 프롬프트가 아니라 재료(대표 메뉴 이름이 최대 20자)를 손봐야 한다.
          recommendation.reason.llm.enabled=${{ vars.PROD_REASON_LLM || 'false' }}

          # 폴리곤 코드/마이그레이션 배포 → 경계·연결 적재 → 운영 좌표 판정 완료 후 추천을 켠다 (#742).
          # 변수 변경 후 CD - Production을 main에서 다시 실행해야 반영된다. 미설정 시 비활성.
          recommendation.polygon.enabled=${{ vars.PROD_POLYGON_RECOMMENDATION_ENABLED || 'false' }}
          recommendation.polygon.version-key=${{ vars.PROD_POLYGON_VERSION_KEY || '' }}
          store.region-resolution.enabled=${{ vars.PROD_REGION_RESOLUTION_ENABLED || 'false' }}
          store.region-resolution.version-key=${{ vars.PROD_POLYGON_VERSION_KEY || '' }}

          # 메뉴 AI 분류 첫 배치를 5분 뒤로 — blue-green 전환이 끝난 뒤 돌게.
          # 30초면 구 컨테이너가 아직 트래픽을 받는 중에 새 kind(카스테라 등)가 메뉴에 붙어
          # 구버전 enum 역직렬화가 깨진다 (V20260814134900 머핀·다쿠아즈 선례와 같은 문제)
          menu.classification.initial-delay-ms=300000

          # 2026-09-09 정지 — 무료 티어 한도(gemini-3.5-flash-lite 500 requests/day)를 넘겨
          # 스케줄러가 429 를 맞고 헛돈다. 1분마다 배치를 잡으면 하루 4,320 요청이 필요한데
          # 한도는 500 이라, 재시도 3회(30초 간격)를 하고 배치 전체가 실패한 뒤 다음 주기에
          # 같은 100건을 또 집는다. 실측: 6시간에 186건 처리, 대기열 23,269건이 안 줄었다.
          # 멈춰도 잃는 게 없다 — 미분류는 카테고리가 빈 채 쌓일 뿐이고, 결제 계정을 붙인 뒤
          # true 로 되돌리면 그대로 대기열에서 이어 처리한다. 그때 fixed-delay-ms 도 같이 줄인다.
          menu.classification.enabled=false

          jwt.secret=${JWT_SECRET}
          jwt.access-token-expiry=1800000
          jwt.refresh-token-expiry=5184000000

          firebase.config.path=firebase/firebase-service-account.json

          oauth2.front-redirect-uri=bbanggut://permission-location

          # 월간 초안만 자동 생성. 발행·푸시는 어드민 검토 후 승인한다.
          monthly-report.auto-preparation.enabled=${{ vars.PROD_MONTHLY_REPORT_AUTO_PREPARATION || 'false' }}
          monthly-report.auto-preparation.asset-version=${{ vars.PROD_MONTHLY_REPORT_ASSET_VERSION || '' }}

          # 기본으로 켠다. 운영 어드민에 발행된 템플릿이 있어야 노출되고, 발행 전에는 켜져 있어도 숨는다.
          # 긴급 중단은 변수 PROD_TUTORIAL_ENABLED=false 로 두고 CD를 다시 실행한다.
          tutorial.enabled=${{ vars.PROD_TUTORIAL_ENABLED || 'true' }}

          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

          logging.level.org.springframework.web=INFO
          logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
          logging.level.org.hibernate.type.descriptor.sql=INFO

          spring.flyway.enabled=true
          spring.flyway.locations=classpath:db/migration
          spring.flyway.baseline-on-migrate=true
          spring.flyway.baseline-version=20260609000000
          spring.flyway.baseline-description=Existing schema before nationwide ranking tables
          spring.flyway.out-of-order=true

          aws.region=ap-northeast-2
          aws.s3.bucket=${{ secrets.PROD_AWS_S3_BUCKET }}


          encrypt.secret-key=${ENCRYPT_SECRET_KEY}

          slack.webhook.url=${SLACK_ERROR_WEBHOOK_URL}
          slack.notification.report-webhook-url=${SLACK_REPORT_WEBHOOK_URL}
          slack.notification.abuse-webhook-url=${SLACK_ABUSE_WEBHOOK_URL}
          slack.notification.letter-webhook-url=${SLACK_LETTER_WEBHOOK_URL}

          # Lambda 콜백 인증 키
          lambda.callback.secret-key=${{ secrets.PROD_LAMBDA_CALLBACK_SECRET_KEY }}


          # 게스트 쓰기 차단 — 새 앱 출시 뒤에 GUEST_WRITE_BLOCKED=true 로 켠다
          guest.write-blocked=${GUEST_WRITE_BLOCKED:false}

          perf.dashboard.enabled=${PERF_DASHBOARD_ENABLED:false}
          perf.dashboard.access-key=${PERF_DASHBOARD_ACCESS_KEY:}
          EOF

      - name: Create Firebase service account file
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources/firebase
          echo "$FIREBASE_JSON" > src/main/resources/firebase/firebase-service-account.json

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:latest

  # 단일 WAS 안에서 blue-green으로 교체한다.
  #   1) 현재 활성 색을 bastion의 Nginx upstream에서 읽는다 (단일 진실 공급원)
  #   2) 반대 색 컨테이너를 WAS에 띄우고 헬스체크
  #   3) bastion Nginx upstream을 새 색으로 전환
  #   4) 도메인으로 실제 응답 확인 후 구 색 정리
  # 어느 단계에서 실패하든 구 색 스택은 살아있으므로 upstream만 되돌리면 복구된다.
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bastion과 WAS를 오가며 값을 주고받아야 해서 액션 대신 ssh를 직접 쓴다.
      # WAS는 프라이빗 서브넷에 있으므로 ProxyJump로 bastion을 경유한다.
      - name: SSH 설정
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          BASTION_HOST: ${{ secrets.PROD_BASTION_HOST }}
          WAS_HOST: ${{ secrets.PROD_WAS_HOST_1 }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${BASTION_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 10
          Host was
            HostName ${WAS_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            ProxyJump bastion
            StrictHostKeyChecking accept-new
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config

      # 활성 색은 bastion의 upstream 설정에만 기록된다.
      # WAS에 떠 있는 컨테이너로 판단하지 않는 이유: 배포가 중간에 실패하면
      # 두 색이 모두 떠 있을 수 있어 "실제로 트래픽을 받는 쪽"과 어긋나기 때문이다.
      - name: 배포 대상 색 결정
        id: color
        run: |
          ACTIVE=$(ssh bastion \
            "grep -oE 'ACTIVE_COLOR=[a-z]+' /etc/nginx/conf.d/bbang-upstream.conf | cut -d= -f2" \
            2>/dev/null || true)

          if [ "$ACTIVE" != "blue" ] && [ "$ACTIVE" != "green" ]; then
            echo "❌ bastion에서 활성 색을 읽지 못했다 (읽은 값: '${ACTIVE}')." >&2
            echo "   deploy/bastion/setup-nginx.sh 를 먼저 1회 실행했는지 확인할 것." >&2
            exit 1
          fi

          if [ "$ACTIVE" = "blue" ]; then
            NEW=green; NEW_APP=8082; NEW_MGMT=8083
          else
            NEW=blue;  NEW_APP=8080; NEW_MGMT=8081
          fi

          echo "현재 활성: ${ACTIVE} → 배포 대상: ${NEW}"
          {
            echo "old=${ACTIVE}"
            echo "new=${NEW}"
            echo "new_app_port=${NEW_APP}"
            echo "new_mgmt_port=${NEW_MGMT}"
          } >> "$GITHUB_OUTPUT"

      # 시크릿을 러너에서 파일로 만든 뒤 전송한다.
      # 원격 셸에 echo로 한 줄씩 밀어넣으면 값에 든 따옴표·백틱이 셸에서 해석된다.
      - name: 환경 파일 생성 및 업로드
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          COLOR: ${{ steps.color.outputs.new }}
          APP_HOST_PORT: ${{ steps.color.outputs.new_app_port }}
          MGMT_HOST_PORT: ${{ steps.color.outputs.new_mgmt_port }}
          DB_URL: ${{ secrets.PROD_DB_URL }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_LOGIN_CLIENT_ID: ${{ secrets.NAVER_LOGIN_CLIENT_ID }}
          NAVER_LOGIN_CLIENT_SECRET: ${{ secrets.NAVER_LOGIN_CLIENT_SECRET }}
          AWS_S3_BUCKET: ${{ secrets.PROD_AWS_S3_BUCKET }}
          ENCRYPT_SECRET_KEY: ${{ secrets.ENCRYPT_SECRET_KEY }}
          SLACK_ERROR_WEBHOOK_URL: ${{ secrets.SLACK_ERROR_WEBHOOK_URL_PROD }}
          SLACK_REPORT_WEBHOOK_URL: ${{ secrets.SLACK_REPORT_WEBHOOK_URL_PROD }}
          SLACK_ABUSE_WEBHOOK_URL: ${{ secrets.SLACK_ABUSE_WEBHOOK_URL_PROD }}
          SLACK_LETTER_WEBHOOK_URL: ${{ secrets.SLACK_LETTER_WEBHOOK_URL_PROD }}
          LAMBDA_CALLBACK_SECRET_KEY: ${{ secrets.PROD_LAMBDA_CALLBACK_SECRET_KEY }}
          GUEST_WRITE_BLOCKED: ${{ secrets.GUEST_WRITE_BLOCKED }}
          PERF_DASHBOARD_ENABLED: ${{ secrets.PERF_DASHBOARD_ENABLED }}
          PERF_DASHBOARD_ACCESS_KEY: ${{ secrets.PERF_DASHBOARD_ACCESS_KEY }}
          ADMIN_API_KEY: ${{ secrets.PROD_ADMIN_API_KEY }}
        run: |
          umask 077
          {
            echo "DOCKER_USERNAME=${DOCKERHUB_USERNAME}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "SPRING_PROFILE=prod"
            echo "COLOR=${COLOR}"
            echo "APP_HOST_PORT=${APP_HOST_PORT}"
            echo "MGMT_HOST_PORT=${MGMT_HOST_PORT}"
            echo "DB_URL=${DB_URL}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}"
            echo "KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "KAKAO_API_KEY=${KAKAO_API_KEY}"
            echo "GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "CLAUDE_API_KEY=${CLAUDE_API_KEY}"
            echo "NAVER_CLIENT_ID=${NAVER_CLIENT_ID}"
            echo "NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}"
            echo "NAVER_LOGIN_CLIENT_ID=${NAVER_LOGIN_CLIENT_ID}"
            echo "NAVER_LOGIN_CLIENT_SECRET=${NAVER_LOGIN_CLIENT_SECRET}"
            echo "AWS_REGION=ap-northeast-2"
            echo "AWS_S3_BUCKET=${AWS_S3_BUCKET}"
            echo "ENCRYPT_SECRET_KEY=${ENCRYPT_SECRET_KEY}"
            echo "SLACK_ERROR_WEBHOOK_URL=${SLACK_ERROR_WEBHOOK_URL}"
            echo "SLACK_REPORT_WEBHOOK_URL=${SLACK_REPORT_WEBHOOK_URL}"
            echo "SLACK_ABUSE_WEBHOOK_URL=${SLACK_ABUSE_WEBHOOK_URL}"
            echo "SLACK_LETTER_WEBHOOK_URL=${SLACK_LETTER_WEBHOOK_URL}"
            echo "LAMBDA_CALLBACK_SECRET_KEY=${LAMBDA_CALLBACK_SECRET_KEY}"
            echo "GUEST_WRITE_BLOCKED=${GUEST_WRITE_BLOCKED:-false}"
            echo "PERF_DASHBOARD_ENABLED=${PERF_DASHBOARD_ENABLED:-false}"
            echo "PERF_DASHBOARD_ACCESS_KEY=${PERF_DASHBOARD_ACCESS_KEY}"
            echo "ADMIN_API_KEY=${ADMIN_API_KEY}"
          } > env.prod

          ssh was 'mkdir -p ~/app'
          scp docker-compose.prod.yml was:~/app/docker-compose.prod.yml
          scp env.prod was:~/app/.env
          rm -f env.prod

      # 정리를 pull 앞에 둔다 — 디스크가 찬 뒤에는 pull 이 "no space left on device" 로 먼저 죽고,
      # set -e 가 스크립트를 끊어 배포 뒤 정리 단계까지 오지 못한다. 공간을 비워줄 명령이 공간을
      # 필요로 하는 명령 뒤에 있는 교착이다 (2026-09-22 운영 배포 실패). 스테이징은 같은 이유로
      # 2026-09-08 에 이미 고쳤는데 운영에는 그 수정이 오지 않았다.
      #
      # 파랑·초록 배포라 구 색 컨테이너가 아직 돌고 있다. 도는 컨테이너가 쓰는 이미지는 prune
      # 대상이 아니므로, 공간이 급해 -a 까지 가도 롤백 대상 이미지는 그대로 남는다.
      - name: 기동 전 디스크 정리
        run: |
          ssh was "
            docker image prune -af --filter 'until=168h' || true
            AVAILABLE_MB=\$(df -Pm / | awk 'NR==2 {print \$4}')
            echo \"여유 공간 \${AVAILABLE_MB}MB\"
            if [ \"\$AVAILABLE_MB\" -lt 4096 ]; then
              echo '4GB 미만 — 안 쓰는 이미지를 모두 정리한다'
              docker image prune -af || true
              df -h /
            fi
          "

      - name: 신규 색 컨테이너 기동
        env:
          NEW: ${{ steps.color.outputs.new }}
        run: |
          # 레이어 다운로드의 일시 오류는 재시도하되, 실패한 이미지로 up을 실행하지 않는다.
          ssh was "
            cd ~/app || exit 1
            for attempt in 1 2 3; do
              if docker compose -p bbang-${NEW} -f docker-compose.prod.yml pull; then
                break
              fi
              if [ \"\$attempt\" -eq 3 ]; then
                echo 'Docker 이미지 다운로드가 3회 실패했습니다. 기존 컨테이너를 유지합니다.'
                exit 1
              fi
              sleep \$((attempt * 5))
            done
            docker compose -p bbang-${NEW} -f docker-compose.prod.yml up -d
          "

      - name: 신규 색 헬스체크
        env:
          NEW: ${{ steps.color.outputs.new }}
          MGMT: ${{ steps.color.outputs.new_mgmt_port }}
        run: |
          echo "⏳ ${NEW} 헬스체크 시작 (최대 180초)..."
          ssh was "
            for i in \$(seq 1 18); do
              if curl -sf http://localhost:${MGMT}/actuator/health/readiness \
                   | grep -q '\"status\":\"UP\"'; then
                echo '✅ ${NEW} 정상 기동 확인'
                exit 0
              fi
              echo \"대기 중... (\$i/18)\"
              sleep 10
            done
            echo '❌ ${NEW} 헬스체크 실패'
            docker compose -p bbang-${NEW} -f ~/app/docker-compose.prod.yml logs --tail 100
            exit 1
          "

      # 여기서부터 트래픽이 신규 색으로 넘어간다. 구 색은 아직 살려둔다.
      - name: Nginx upstream 전환
        env:
          NEW: ${{ steps.color.outputs.new }}
          WAS_HOST: ${{ secrets.PROD_WAS_HOST_1 }}
        run: |
          ssh bastion "sudo /opt/bbang/switch-upstream.sh ${NEW} ${WAS_HOST}"

      # 서버 안에서 자기 자신을 본 헬스체크는 Nginx 경로가 정상인지 알려주지 않는다.
      # 도메인으로 실제 한 바퀴 돌려 확인한 뒤에야 구 색을 내린다.
      - name: 도메인 스모크 테스트
        run: |
          echo "⏳ https://bbang-ggut.cloud 응답 확인..."
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://bbang-ggut.cloud/menu-categories || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✅ 도메인 응답 정상 (200)"
              exit 0
            fi
            echo "대기 중... ($i/10) 응답 코드: ${CODE}"
            sleep 5
          done
          echo "❌ 도메인 스모크 테스트 실패"
          exit 1

      - name: 구 색 정리
        env:
          OLD: ${{ steps.color.outputs.old }}
        run: |
          ssh was "cd ~/app \
            && docker compose -p bbang-${OLD} -f docker-compose.prod.yml down --remove-orphans"

          # 단일 서버 전환 이전의 배포가 남긴 구 방식 스택(compose 프로젝트 'app')을
          # 함께 정리한다. 그 컨테이너가 8080을 점유한 채로 남으면 다음 blue 배포가
          # 포트 충돌로 실패한다. 트래픽은 이미 신규 색으로 넘어간 뒤라 영향이 없다.
          # 전환 후 첫 배포에서 한 번만 지워지고, 이후에는 대상이 없어 조용히 넘어간다.
          ssh was "cd ~/app \
            && docker compose -f docker-compose.yml down --remove-orphans 2>/dev/null || true"
          # 직전 버전 이미지는 남긴다 — 신규 컨테이너가 기동에 실패했을 때
          # IMAGE_TAG만 되돌려 즉시 롤백할 수 있어야 한다.
          # -a 가 없으면 dangling 만 지운다. 배포마다 새 태그가 붙어 dangling 이 생기지 않으니
          # 이 명령으로는 한 장도 안 지워졌고, 종전 이미지가 무한히 쌓여 디스크가 찼다.
          # until 은 168h 그대로 둔다 — 일주일 치 롤백 대상은 남긴다.
          ssh was "docker image prune -af --filter 'until=168h'"

      # 어느 단계에서 실패했든 구 색 스택은 아직 살아있다. upstream만 되돌리면 복구된다.
      - name: 실패 시 롤백
        if: failure() && steps.color.outputs.old != ''
        env:
          OLD: ${{ steps.color.outputs.old }}
          NEW: ${{ steps.color.outputs.new }}
          WAS_HOST: ${{ secrets.PROD_WAS_HOST_1 }}
        run: |
          echo "⚠️ 배포 실패 — upstream을 ${OLD}로 되돌린다"
          ssh bastion "sudo /opt/bbang/switch-upstream.sh ${OLD} ${WAS_HOST}" || true
          ssh was "cd ~/app \
            && docker compose -p bbang-${NEW} -f docker-compose.prod.yml down" || true
          echo "롤백 완료 — 활성 색: ${OLD}"

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Get PR title
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 실패(권한 403 등) 시 에러 본문이 제목에 섞이지 않도록 성공했을 때만 채택한다
          if ! PR_TITLE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""' 2>/dev/null); then
            PR_TITLE=""
          fi
          if [ -z "$PR_TITLE" ]; then
            # 머지 커밋 메시지는 여러 줄 — 첫 줄만 제목으로 쓴다 (GITHUB_OUTPUT 형식 보호)
            PR_TITLE=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n 1)
          fi
          {
            echo "title<<PR_TITLE_EOF"
            printf '%s\n' "$PR_TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack (성공)
        if: needs.deploy.result == 'success'
        env:
          # 쉘 인라인(${{ }}) 주입 금지 — 제목의 따옴표·특수문자가 jq 명령을 깨뜨린다 (env 경유가 안전)
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_PROD }}
        run: |
          RESPONSE=$(jq -n \
            --arg pr "$PR_TITLE" \
            --arg tag "$IMAGE_TAG" \
            '{attachments: [{
              "color": "#2ECC71",
              "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": "🚀 배포 완료 [PROD]", "emoji": true}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*PR*\n\($pr)"},
                  {"type": "mrkdwn", "text": "*Image Tag*\n\($tag)"},
                  {"type": "mrkdwn", "text": "*Branch*\nmain"},
                  {"type": "mrkdwn", "text": "*배포 방식*\nblue-green (단일 WAS)"}
                ]}
              ]
            }]}' | \
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-)
          # 웹훅 정상 응답은 "ok" — 아니면 로그에 경고를 남긴다 (배포는 이미 성공이므로 잡을 실패시키지 않음)
          if [ "$RESPONSE" != "ok" ]; then
            echo "::warning::Slack 배포 알림 실패: $RESPONSE"
          fi

      - name: Notify Slack (실패)
        if: needs.deploy.result == 'failure'
        env:
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_PROD }}
        run: |
          RESPONSE=$(jq -n \
            --arg pr "$PR_TITLE" \
            --arg tag "$IMAGE_TAG" \
            '{attachments: [{
              "color": "#E74C3C",
              "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": "❌ 배포 실패 [PROD]", "emoji": true}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*PR*\n\($pr)"},
                  {"type": "mrkdwn", "text": "*Image Tag*\n\($tag)"},
                  {"type": "mrkdwn", "text": "*상태*\n이전 색으로 자동 롤백됨"}
                ]}
              ]
            }]}' | \
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-)
          if [ "$RESPONSE" != "ok" ]; then
            echo "::warning::Slack 배포 알림 실패: $RESPONSE"
          fi
