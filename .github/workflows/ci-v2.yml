name: CI - V2 Build & Test
on:
  pull_request:
    branches: [develop-v2]
    # 문서·Claude 설정만 바꾼 PR 은 빌드할 게 없다 — v1 의 ci.yml 과 같은 예외.
    # 필수 체크(브랜치 보호)가 없어, 건너뛴 워크플로가 머지를 막지는 않는다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      build_scope: ${{ steps.diff.outputs.build_scope }}
      batch: ${{ steps.diff.outputs.batch }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope selection
        run: python3 -m unittest discover -s scripts/ci/tests -p test_select_v2_checks.py -v
      - name: Detect backend and batch changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/select_v2_checks.py

  build-v2:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 기본값은 기본 브랜치(main)에서만 캐시를 쓴다. develop-v2 는 기본 브랜치가 아니라 매 실행이 캐시 미스였다
          # (Gradle 배포판·의존성 내려받기 약 100초). push 와 PR 모두 쓰게 한다.
          cache-read-only: false
      # 러너 사양(CPU·메모리) — 병렬·포크 설정은 이 값에 맞춰야 한다.
      - name: Runner spec
        run: |
          echo "nproc=$(nproc)"; free -m | head -2; df -h / | tail -1
      - name: Build and test selected scope
        env:
          BUILD_SCOPE: ${{ needs.changes.outputs.build_scope }}
        run: |
          # :batch:build도 배치 테스트 전체를 실행한다. 개별 테스트·태그를 제외하지 않는다.
          case "$BUILD_SCOPE" in
            batch) ./gradlew :batch:build -x installGitHooks --no-daemon ;;
            full) ./gradlew build -x installGitHooks --no-daemon ;;
            *) echo "::error::Unknown build scope"; exit 1 ;;
          esac
  # 워크플로 파일이 바뀐 PR 에서만 돈다 — 입력이 같으면 결과도 지난 실행과 같다.
  deployment-config:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 배포 스크립트 테스트는 각 CD 가 빌드 직전에 돌리고(cd-v2·cd-batch), 가드 테스트는 migration-guard 가 돌린다.
      - name: Check workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/cd-v2.yml .github/workflows/ci-v2.yml .github/workflows/cd-batch.yml .github/workflows/migration-guard.yml .github/workflows/slack-notify.yml
  # 배치 이미지가 빌드되는지만 본다(푸시 없음). 배포는 cd-batch 가 ARM64 로 다시 빌드한다.
  # 배치 경로 또는 배치 JAR에 영향을 주는 공통 코드·빌드 설정 변경에 실행한다.
  batch-image:
    needs: changes
    if: needs.changes.outputs.batch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 기본값은 기본 브랜치(main)에서만 캐시를 쓴다. develop-v2 는 기본 브랜치가 아니라 매 실행이 캐시 미스였다
          # (Gradle 배포판·의존성 내려받기 약 100초). push 와 PR 모두 쓰게 한다.
          cache-read-only: false
      - name: Build batch JAR
        run: |
          ./gradlew :batch:bootJar -x installGitHooks --no-daemon
          mkdir -p build/batch
          mapfile -t jars < <(find batch/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" build/batch/batch.jar
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.batch
          platforms: linux/amd64
          push: false
          load: true
          tags: bbang-batch:ci
          # PR 재실행에서 apt·venv·Chromium 레이어를 재사용한다. CD의 ARM64 캐시와 분리한다.
          cache-from: type=gha,scope=ci-batch-amd64,version=2
          cache-to: type=gha,scope=ci-batch-amd64,version=2,mode=max,ignore-error=true
      - name: Entrypoint rejects unknown commands
        run: |
          set +e
          docker run --rm bbang-batch:ci unknown
          test "$?" -eq 64

  notify-failure:
    needs: [changes, build-v2, deployment-config, batch-image]
    if: >-
      always() && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/slack-notify.yml
    with:
      component: V2 공통 검증
      kind: CI
      results: ${{ toJSON(needs) }}
    secrets:
      webhook-url: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
