name: CI - V2 Build & Test
on:
  pull_request:
    branches: [develop-v2]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          workflow_files = {
              '.github/workflows/cd-redis-prod.yml', '.github/workflows/cd-v2.yml',
              '.github/workflows/cd-prod.yml', '.github/workflows/cd-staging.yml',
              '.github/workflows/ci-v2.yml',
          }
          files = subprocess.check_output([
              'git', 'diff', '--no-renames', '--name-only', '-z',
              os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'],
          ]).decode().split('\0')
          paths = [path for path in files if path]
          touches_redis = any(path.startswith('infra/redis/') or
              path == '.github/workflows/cd-redis-prod.yml' for path in paths)
          redis_only = touches_redis and all(path.startswith('infra/redis/') or
              path in workflow_files for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'backend={str(not redis_only).lower()}\n')
          PYCODE

  build-v2:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -x installGitHooks --no-daemon
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment behavior without AWS credentials
        run: |
          python3 -m unittest discover -s scripts/deploy/v2/tests -v
          python3 -m unittest discover -s scripts/deploy/batch/tests -v
          bash -n scripts/deploy/batch/entrypoint.sh
      - name: Check workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/cd-v2.yml .github/workflows/ci-v2.yml .github/workflows/cd-batch.yml
  # dataops 크롤·승인 스크립트(배치 EC2 에서 돈다). 에이전트 스모크 테스트도 import 되도록 그 lock 을 함께 설치한다
  dataops-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dataops/requirements.txt -r dataops/scripts/requirements-agent-smoke.lock
      - working-directory: dataops
        run: python -m unittest discover -s scripts/tests
  # 배치 이미지가 빌드되는지만 본다(푸시 없음). 배포는 cd-batch 가 ARM64 로 다시 빌드한다
  batch-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build batch JAR
        run: |
          ./gradlew :batch:bootJar -x installGitHooks --no-daemon
          mkdir -p build/batch
          mapfile -t jars < <(find batch/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" build/batch/batch.jar
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.batch
          push: false
          load: true
          tags: bbang-batch:ci
      - name: Entrypoint rejects unknown commands
        run: |
          set +e
          docker run --rm bbang-batch:ci unknown
          test "$?" -eq 64
