name: Naver - 사진 보충

# 사용자가 네이버 검색으로 직접 추가한 가게는 naver_place_id 는 있지만 사진이 없다.
# (naver_place_id 가 있으면 '매칭 완료'로 분류돼 기존 enrich 큐에는 안 잡힌다)
# 사진 보충 큐(naver-photos-backfill-queue)를 주기적으로 비워 준다.
#
# 크롤러가 Playwright(실제 브라우저)를 쓰기 때문에 서버 @Scheduled 가 아니라
# Actions 러너에서 돌린다.

on:
  schedule:
    # 매일 04:00 KST (= 19:00 UTC 전날). 네이버 부하가 적은 시간대.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: "백엔드 주소"
        required: false
        default: "https://bbang-ggut.cloud"
      max_batches:
        description: "최대 배치 수 (0 = 큐가 빌 때까지)"
        required: false
        default: "10"
      dry_run:
        description: "실제 저장 없이 시뮬레이션만"
        type: boolean
        required: false
        default: false

# 이전 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다 — 네이버 차단 위험을 줄인다.
concurrency:
  group: naver-photos-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 크롤링은 오래 걸릴 수 있고, 무한정 매달리지 않게 상한을 둔다.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run photo backfill
        working-directory: scripts
        env:
          SERVER: ${{ inputs.server || 'https://bbang-ggut.cloud' }}
          MAX_BATCHES: ${{ inputs.max_batches || '10' }}
        run: |
          python naver_menu_scraper.py \
            --photos-only \
            --server "$SERVER" \
            --loop \
            --max-batches "$MAX_BATCHES" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
