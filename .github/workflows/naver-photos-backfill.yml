name: Naver - 사진 보충

# 사용자가 네이버 검색으로 직접 추가한 가게는 naver_place_id 는 있지만 사진이 없다.
# (naver_place_id 가 있으면 '매칭 완료'로 분류돼 기존 enrich 큐에는 안 잡힌다)
# 사진 보충 큐(naver-photos-backfill-queue)를 주기적으로 비워 준다.
#
# 크롤러가 Playwright(실제 브라우저)를 쓰기 때문에 서버 @Scheduled 가 아니라
# Actions 러너에서 돌린다.

# 스케줄을 뗀다 (2026-09-08). 2026-08-09 이후 42회 실행이 전부 실패했고(cancelled 32 · failure 10)
# 성공한 적이 한 번도 없다 — 매일 네이버를 긁으면서 실제로 채운 사진은 0장이다.
#
# 사진을 채운 것은 dataops 의 image_backfill_worker 다(가게 15,401장 · 메뉴 65,085장). 그쪽은
# 네이버를 다시 긁지 않고 이미 쌓아둔 스냅샷에서 점주 사진 URL 만 뽑아 서버에 넘긴다 — 크롤이
# 없으니 빠르고 차단 위험도 없다. 사진 보충은 그 경로로 일원화한다.
#
# 수동 실행은 남겨둔다 — 스냅샷이 없는 가게를 급히 채워야 할 때의 탈출구.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "백엔드 주소"
        required: false
        default: "https://bbang-ggut.cloud"
      max_batches:
        description: "최대 배치 수 (0 = 큐가 빌 때까지)"
        required: false
        default: "10"
      dry_run:
        description: "실제 저장 없이 시뮬레이션만"
        type: boolean
        required: false
        default: false

# 이전 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다 — 네이버 차단 위험을 줄인다.
concurrency:
  group: naver-photos-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 크롤링은 오래 걸릴 수 있고, 무한정 매달리지 않게 상한을 둔다.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run photo backfill
        working-directory: scripts
        env:
          SERVER: ${{ inputs.server || 'https://bbang-ggut.cloud' }}
          MAX_BATCHES: ${{ inputs.max_batches || '10' }}
          # job timeout-minutes(60) 보다 짧게 준다. 스크립트가 스스로 멈추면 진행 요약과 로그가 남고,
          # 가게 하나를 처리하던 중간에 잘리지도 않는다. 큐가 커서 하루에 다 비우지 못하는 건 정상이다.
          MAX_SECONDS: "2700"
        run: |
          python naver_menu_scraper.py \
            --photos-only \
            --server "$SERVER" \
            --loop \
            --max-batches "$MAX_BATCHES" \
            --max-seconds "$MAX_SECONDS" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
