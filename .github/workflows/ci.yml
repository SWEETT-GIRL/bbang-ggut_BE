name: CI - Build & Test

on:
  pull_request:
    branches: [ main, dev ]
    # 문서·Claude 설정만 바꾼 PR 은 빌드·테스트할 게 없다 — Actions 무료 분량(월 2,000분)을 아낀다
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  # PR 검사는 각 PR 을 따로 본다. 둘이 각자 통과해도 합쳐지면 깨질 수 있어(10/12: #895 가 조회를 바꾸고
  # #896 이 옛 조회를 모킹하는 테스트를 넣어 dev 에서 2건 실패) 머지된 dev 를 한 번 더 돌린다.
  push:
    branches: [ dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

# 같은 PR 에 연달아 푸시하면 앞선 실행은 결과를 볼 일이 없으니 취소한다.
# dev 푸시는 PR 번호가 없어 브랜치 이름으로 묶인다 — 연달아 머지하면 마지막 상태만 검사한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -x test --no-daemon && exit 0
            sleep $((attempt * 10))
          done

          exit 1

      # 기본 test 는 H2 로 돈다. 로컬 랩 PG(@Tag lab)·실제 LLM 호출(@Tag llm) 테스트는 build.gradle 에서 제외된다
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
