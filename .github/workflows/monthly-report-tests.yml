name: Monthly report tests
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monthly_report_test
          POSTGRES_USER: monthly_report_test
          POSTGRES_PASSWORD: monthly_report_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monthly_report_test -d monthly_report_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONTHLY_REPORT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/monthly_report_test
      MONTHLY_REPORT_TEST_DB_USER: monthly_report_test
      MONTHLY_REPORT_TEST_DB_PASSWORD: monthly_report_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify monthly report and notification contracts
        run: >-
          ./gradlew test -PlabTests
          --tests 'sweetgirl.croissant.monthlyreport.*'
          --tests 'sweetgirl.croissant.alarm.service.FcmServiceTest'
          --tests 'sweetgirl.croissant.alarm.service.PushDispatcherTest'
          --tests 'sweetgirl.croissant.alarm.service.AlarmCommandServiceTest'
          --tests 'sweetgirl.croissant.letter.config.AdminApiKeyFilterTest'
          --tests 'sweetgirl.croissant.breadlog.service.BreadRecordCommandServiceTest'
          --tests 'sweetgirl.croissant.personalization.service.UserInteractionIngestCommandServiceTest'
          --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-report-test-results
          path: |
            build/reports/tests/test
            build/test-results/test
