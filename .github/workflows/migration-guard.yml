name: Migration Guard
on:
  pull_request:
    branches: [develop-v2]
    # 라벨을 달거나 뗐을 때도 다시 판정한다
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'core/src/main/resources/db/migration/**'
      - 'scripts/ci/**'
      - '.github/workflows/migration-guard.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 가드 스크립트의 단위 테스트. ci-v2 에서 옮겨 왔다 — 이 워크플로가 scripts/ci/** 변경에 반응하므로 여기서 돈다.
      - name: Run the guard's own tests
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Check migrations against the current base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch origin "$BASE_REF"
          python3 scripts/ci/check_migrations.py --base "origin/$BASE_REF" --head "$HEAD_SHA" --labels "$LABELS"
