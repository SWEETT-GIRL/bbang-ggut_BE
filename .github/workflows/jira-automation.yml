name: Jira Automation - Create GitHub Issue & Branch

on:
  repository_dispatch:
    types: [jira_issue_created]

jobs:
  create-issue-and-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Formulate Branch Name and Find Template
        id: setup
        run: |
          IKEY="${{ github.event.client_payload.key }}"
          ITYPE="${{ github.event.client_payload.type }}"
          ISUMMARY="${{ github.event.client_payload.summary }}"
          IREPORTER="${{ github.event.client_payload.reporter }}"
          IASSIGNEE="${{ github.event.client_payload.assignee }}"
          IJIRAURL="${{ github.event.client_payload.jiraUrl }}"
          IBODY="${{ github.event.client_payload.body }}"
          PARENT_KEY="${{ github.event.client_payload.parentKey }}"

          ILABEL=$(echo "$ITYPE" | tr '[:upper:]' '[:lower:]')
          
          TEMPLATE_FILE=".github/ISSUE_TEMPLATE/✨-feature.md"
          TYPE_SHORT="feat"
          GH_LABEL="feature"
          TITLE_PREFIX="✨ feat: "

          if [[ "$ILABEL" == *"story"* ]]; then
            TYPE_SHORT="story"
            GH_LABEL="story"
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/📖-story.md"
            TITLE_PREFIX="📖 story: "
          elif [[ "$ILABEL" == *"bug"* ]]; then
            TYPE_SHORT="fix"
            GH_LABEL="bug"
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/🐛-fix.md"
            TITLE_PREFIX="🐛 fix: "
          elif [[ "$ILABEL" == *"refactor"* ]]; then
            TYPE_SHORT="refactor"
            GH_LABEL="refactor"
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/♻️-refactor.md"
            TITLE_PREFIX="♻️ refactor: "
          elif [[ "$ILABEL" == *"documentation"* ]]; then
            TYPE_SHORT="docs"
            GH_LABEL="documentation"
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/📝-docs.md"
            TITLE_PREFIX="📝 docs: "
          elif [[ "$ILABEL" == *"test"* ]]; then
            TYPE_SHORT="test"
            GH_LABEL="test"
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/✅-test.md"
            TITLE_PREFIX="✅ test: "
          elif [[ "$ILABEL" == *"ci/cd"* ]]; then
            TYPE_SHORT="cicd"         
            GH_LABEL="ci/cd"         
            TEMPLATE_FILE=".github/ISSUE_TEMPLATE/💚-ci-cd.md"
            TITLE_PREFIX="💚 ci/cd: "
          fi

          CLEAN_SUMMARY=$(echo "$ISUMMARY" | tr ' ' '-' | tr -cd '[:alnum:]-')
          BRANCH_NAME="${IKEY}-${TYPE_SHORT}-${CLEAN_SUMMARY}"
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "TYPE_SHORT=$TYPE_SHORT" >> $GITHUB_ENV
          echo "GH_LABEL=$GH_LABEL" >> $GITHUB_ENV

          GH_USER=""
          if [ -n "$IASSIGNEE" ] && [ "$IASSIGNEE" != "null" ]; then
            case "$IASSIGNEE" in
              "이현정") GH_USER="howareyou2" ;;
              # "지라이름") GH_USER="깃허브ID" ;;
              *) GH_USER="" ;;
            esac
          fi
          echo "GH_ASSIGNEE=$GH_USER" >> $GITHUB_ENV

          TITLE="[$IKEY] ${TITLE_PREFIX}${ISUMMARY}"
          echo "ISSUE_TITLE=$TITLE" >> $GITHUB_ENV

          NORM_BODY=$(echo -e "$IBODY")
          
          EXTRACT_TITLE=$(echo "$NORM_BODY" | sed -n '/# Title/,/# TODO/p' | grep -v -E '# Title|# TODO' | sed '/^[[:space:]]*$/d')
          EXTRACT_TODO=$(echo "$NORM_BODY" | sed -n '/# TODO/,/# etc/p' | grep -v -E '# TODO|# etc' | sed '/^[[:space:]]*$/d')
          EXTRACT_ETC=$(echo "$NORM_BODY" | sed -n '/# etc/,$p' | grep -v -E '# etc' | sed '/^[[:space:]]*$/d')

          if [ -f "$TEMPLATE_FILE" ]; then
            TEMPLATE_CONTENT=$(sed '1,/^---$/d' "$TEMPLATE_FILE")
          else
            TEMPLATE_CONTENT="# Title\n\n# TODO\n\n# etc"
          fi

          MAPPED_BODY="$TEMPLATE_CONTENT"
          
          if [ -n "$EXTRACT_TITLE" ]; then
            MAPPED_BODY=$(echo -e "$MAPPED_BODY" | sed "s/- 이 스토리가 해결하고자 하는 비즈니스 가치나 유저 시나리오를 기술합니다./$EXTRACT_TITLE/g" 2>/dev/null || echo -e "$MAPPED_BODY" | sed "s/- 자세한 개요 작성/$EXTRACT_TITLE/g")
          fi
          
          if [ -n "$EXTRACT_TODO" ]; then
            MAPPED_BODY=$(echo -e "$MAPPED_BODY" | sed "s/- \[ \] 요구사항 정의 및 설계 검토\n- \[ \] 하위 개발 Task 카드 생성 및 연역 맵핑\n- \[ \] 테스트 코드 작성 및 기능 검증/$EXTRACT_TODO/g" 2>/dev/null || echo -e "$MAPPED_BODY" | sed "s/- \[ \] 투두 내용 작성/$EXTRACT_TODO/g")
          fi

          if [ -n "$EXTRACT_ETC" ]; then
            MAPPED_BODY=$(echo -e "$MAPPED_BODY" | sed "s/- 와이어프레임, 기획서 링크 또는 참고자료 등을 첨부합니다./$EXTRACT_ETC/g" 2>/dev/null || echo -e "$MAPPED_BODY" | sed "s/- 참고 자료 작성/$EXTRACT_ETC/g")
          fi

          LOWER_BANNER="\n\n---\n### 🔗 연동 정보\n- **Jira 링크**: [${IKEY} 바로가기](${IJIRAURL})"
          
          FINAL_BODY=$(echo -e "${MAPPED_BODY}${LOWER_BANNER}")

          echo "FINAL_BODY<<EOF" >> $GITHUB_ENV
          echo "$FINAL_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Issue via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.JIRA_GITHUB_TOKEN }}
        run: |
          if [ -n "${{ env.GH_ASSIGNEE }}" ]; then
            NEW_ISSUE_URL=$(gh issue create \
              --title "${{ env.ISSUE_TITLE }}" \
              --body "$FINAL_BODY" \
              --label "${{ env.GH_LABEL }}" \
              --assignee "${{ env.GH_ASSIGNEE }}" \
              --repo "${{ github.repository }}")
          else
            NEW_ISSUE_URL=$(gh issue create \
              --title "${{ env.ISSUE_TITLE }}" \
              --body "$FINAL_BODY" \
              --label "${{ env.GH_LABEL }}" \
              --repo "${{ github.repository }}")
          fi
          
          echo "ISSUE_URL=$NEW_ISSUE_URL" >> $GITHUB_ENV
          echo "새 생성된 이슈 URL: $NEW_ISSUE_URL"

      - name: Link Task to Parent Story Issue via GitHub Tasklists
        env:
          GH_TOKEN: ${{ secrets.JIRA_GITHUB_TOKEN }}
        run: |
          PARENT_KEY="${{ github.event.client_payload.parentKey }}"

          if [ -n "$PARENT_KEY" ] && [ "$PARENT_KEY" != "null" ]; then
            echo "부모 스토리 이슈 검색 중: $PARENT_KEY"

            PARENT_ISSUE_NUM=$(gh issue list \
              --search "[$PARENT_KEY] in:title" \
              --json number \
              --jq '.[0].number')
            
            if [ -n "$PARENT_ISSUE_NUM" ] && [ "$PARENT_ISSUE_NUM" != "null" ]; then
              echo "매칭되는 깃허브 부모 이슈 발견: #$PARENT_ISSUE_NUM"

              PARENT_BODY=$(gh issue view $PARENT_ISSUE_NUM --json body --jq '.body')
              TASK_LINK="${{ env.ISSUE_URL }}"

              if [[ "$PARENT_BODY" != *"\`\`\`tasklist"* ]]; then
                echo -e "${PARENT_BODY}\n\n### 📋 하위 작업\n\`\`\`tasklist\n- $TASK_LINK\n\`\`\`" > new_body.txt
              else
                CLEANED_BODY=$(echo -e "$PARENT_BODY" | sed 's/\`\`\`$//')
                echo -e "${CLEANED_BODY}- ${TASK_LINK}\n\`\`\`" > new_body.txt
              fi
              
              gh issue edit $PARENT_ISSUE_NUM -F new_body.txt
              echo "부모 이슈 #$PARENT_ISSUE_NUM 에 성공적으로 연동했습니다."
            else
              echo "깃허브에서 [$PARENT_KEY] 타이틀을 가진 부모 이슈를 찾지 못해 연동을 건너뜁니다."
            fi
          fi

      - name: Create and Push Git Branch
        if: env.TYPE_SHORT != 'story'
        env:
          MY_PAT: ${{ secrets.JIRA_GITHUB_TOKEN }}
        run: |
          git config --global user.name "jira-bot"
          git config --global user.email "jira-bot@github.com"

          git fetch origin dev
          git checkout dev

          git checkout -b ${{ env.BRANCH_NAME }}
          git push https://x-access-token:${{ env.MY_PAT }}@github.com/${{ github.repository }}.git ${{ env.BRANCH_NAME }}
