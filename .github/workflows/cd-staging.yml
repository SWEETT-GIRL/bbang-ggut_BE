name: CD - Staging

on:
  push:
    branches: [ dev ]

# 배포 알림의 PR 타이틀 조회(gh api …/pulls)에 필요 — 없으면 403으로 에러 본문이 제목에 섞인다
permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=develop-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application-staging.properties
        run: |
          cat > src/main/resources/application-staging.properties << 'EOF'
          spring.datasource.url=${DB_URL}
          spring.datasource.username=${DB_USERNAME}
          spring.datasource.password=${DB_PASSWORD}
          spring.datasource.driver-class-name=org.postgresql.Driver

          spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
          spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
          spring.security.oauth2.client.registration.kakao.redirect-uri=https://bbang-ggut.site/api/v1/oauth2/kakao
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          kakao.api.base-url=https://dapi.kakao.com
          kakao.api.key=${KAKAO_API_KEY}

          google.places.api-key=${GOOGLE_PLACES_API_KEY}

          jwt.secret=${JWT_SECRET}
          jwt.access-token-expiry=1800000
          jwt.refresh-token-expiry=5184000000

          firebase.config.path=firebase/firebase-service-account.json

          oauth2.front-redirect-uri=bbanggut://permission-location

          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

          logging.level.org.springframework.web=INFO
          logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
          logging.level.org.hibernate.type.descriptor.sql=INFO

          spring.flyway.enabled=true
          spring.flyway.locations=classpath:db/migration,classpath:db/seed/staging
          spring.flyway.baseline-on-migrate=true
          spring.flyway.baseline-version=20260609000000
          spring.flyway.baseline-description=Existing schema before nationwide ranking tables
          spring.flyway.out-of-order=true
          
          aws.region=ap-northeast-2
          aws.s3.bucket=${{ secrets.STAGING_AWS_S3_BUCKET }}
          opensearch.endpoint=${{ secrets.STAGING_OPENSEARCH_ENDPOINT }}

          posthog.api-key=${{secrets.STAGING_POSTHOG_API_KEY}}
          posthog.host=https://us.i.posthog.com

          springdoc.swagger-ui.enabled=true
          springdoc.api-docs.enabled=true
          swagger.server-url=https://bbang-ggut.site
          swagger.server-description=Staging

          # AES-256 암호화 키
          encrypt.secret-key=${ENCRYPT_SECRET_KEY}

          # Slack 웹훅
          slack.webhook.url=${SLACK_ERROR_WEBHOOK_URL}
          slack.notification.report-webhook-url=${SLACK_REPORT_WEBHOOK_URL}
          slack.notification.abuse-webhook-url=${SLACK_ABUSE_WEBHOOK_URL}

          # Lambda 콜백 인증 키
          lambda.callback.secret-key=${{secrets.LAMBDA_CALLBACK_SECRET_KEY}}

          # 성능 측정 대시보드
          perf.dashboard.enabled=${PERF_DASHBOARD_ENABLED:false}
          perf.dashboard.access-key=${PERF_DASHBOARD_ACCESS_KEY:}
          EOF

      - name: Create Firebase service account file
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources/firebase
          echo "$FIREBASE_JSON" > src/main/resources/firebase/firebase-service-account.json

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:develop-latest

      - name: Upload docker-compose to Staging EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_KEY }}
          source: docker-compose.yml,docker-compose.scouter.yml
          target: ~/app
          proxy_host: ${{ secrets.STAGING_BASTION_HOST }}
          proxy_username: ${{ secrets.STAGING_BASTION_USER }}
          proxy_key: ${{ secrets.STAGING_BASTION_KEY }}

      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_KEY }}
          proxy_host: ${{ secrets.STAGING_BASTION_HOST }}
          proxy_username: ${{ secrets.STAGING_BASTION_USER }}
          proxy_key: ${{ secrets.STAGING_BASTION_KEY }}
          script: |
            cd ~/app

            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}" >> .env
            echo "SPRING_PROFILE=staging" >> .env
            echo "DB_URL=${{ secrets.STAGING_DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }}" >> .env
            echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
            echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env
            echo "AWS_REGION=ap-northeast-2" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.STAGING_AWS_S3_BUCKET }}" >> .env
            echo "OPENSEARCH_REGION=ap-northeast-2" >> .env
            echo "STAGING_POSTHOG_API_KEY=${{ secrets.STAGING_POSTHOG_API_KEY }}" >> .env
            echo "ENCRYPT_SECRET_KEY=${{ secrets.ENCRYPT_SECRET_KEY }}" >> .env
            echo "SLACK_ERROR_WEBHOOK_URL=${{ secrets.SLACK_ERROR_WEBHOOK_URL_DEV }}" >> .env
            echo "SLACK_REPORT_WEBHOOK_URL=${{ secrets.SLACK_REPORT_WEBHOOK_URL_DEV }}" >> .env
            echo "SLACK_ABUSE_WEBHOOK_URL=${{ secrets.SLACK_ABUSE_WEBHOOK_URL_DEV }}" >> .env
            echo "LAMBDA_CALLBACK_SECRET_KEY=${{ secrets.LAMBDA_CALLBACK_SECRET_KEY }}" >> .env
            echo "PERF_DASHBOARD_ENABLED=true" >> .env
            echo "PERF_DASHBOARD_ACCESS_KEY=${{ secrets.PERF_DASHBOARD_ACCESS_KEY }}" >> .env
            echo "REDIS_HOST=${{ secrets.STAGING_REDIS_HOST }}" >> .env
            echo "SCOUTER_OBJ_NAME=bbang-staging" >> .env
            echo "SCOUTER_SERVER_PORT=6100" >> .env
            echo "SCOUTER_WEB_PORT=6188" >> .env

            docker compose -f docker-compose.yml -f docker-compose.scouter.yml pull
            docker compose -f docker-compose.yml -f docker-compose.scouter.yml up -d
            # 직전 버전 이미지는 남긴다 — 롤백 시 IMAGE_TAG만 되돌리면 되도록.
            docker image prune -f --filter "until=168h"

      - name: Get PR title
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 실패(권한 403 등) 시 에러 본문이 제목에 섞이지 않도록 성공했을 때만 채택한다
          if ! PR_TITLE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""' 2>/dev/null); then
            PR_TITLE=""
          fi
          if [ -z "$PR_TITLE" ]; then
            # 머지 커밋 메시지는 여러 줄 — 첫 줄만 제목으로 쓴다 (GITHUB_OUTPUT 형식 보호)
            PR_TITLE=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n 1)
          fi
          {
            echo "title<<PR_TITLE_EOF"
            printf '%s\n' "$PR_TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: success()
        env:
          # 쉘 인라인(${{ }}) 주입 금지 — 제목의 따옴표·특수문자가 jq 명령을 깨뜨린다 (env 경유가 안전)
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_DEV }}
        run: |
          RESPONSE=$(jq -n \
            --arg pr "$PR_TITLE" \
            --arg tag "$IMAGE_TAG" \
            '{attachments: [{
              "color": "#58B9FF",
              "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": "🚀 배포 완료 [STAGING]", "emoji": true}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*PR*\n\($pr)"},
                  {"type": "mrkdwn", "text": "*Image Tag*\n\($tag)"},
                  {"type": "mrkdwn", "text": "*Branch*\ndev"}
                ]}
              ]
            }]}' | \
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-)
          # 웹훅 정상 응답은 "ok" — 아니면 로그에 경고를 남긴다 (배포는 이미 성공이므로 잡은 실패시키지 않음)
          if [ "$RESPONSE" != "ok" ]; then
            echo "::warning::Slack 배포 알림 실패: $RESPONSE"
          fi
