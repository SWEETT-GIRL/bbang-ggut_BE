name: CD - Staging

on:
  push:
    branches: [ dev ]
    # 문서·Claude 설정만 바뀐 머지는 다시 띄울 이유가 없다
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  # 코드 변경 없이 설정만 바꿔 다시 띄울 때 — Repository variables 를 고친 뒤 여기서 수동 실행한다.
  # 이게 없으면 변수를 바꿔도 다음 dev 머지까지 반영되지 않는다.
  workflow_dispatch:

# 같은 EC2의 .env·Compose 파일과 Docker 저장소를 동시에 변경하지 않는다.
# 실행 중인 배포는 끝내고 다음 배포를 시작한다.
concurrency:
  group: cd-staging
  cancel-in-progress: false

# 배포 알림의 PR 타이틀 조회(gh api …/pulls)에 필요 — 없으면 403으로 에러 본문이 제목에 섞인다
permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dev 와 prod 가 같은 키로 토큰을 서명하면 dev 에서 받은 토큰이 prod 에서 그대로 통한다(dev DB 가 prod 덤프라
      # 회원 id 까지 겹친다). 그래서 dev 는 제 키를 쓴다 — 비어 있거나 prod 와 같으면 띄우지 않는다.
      - name: Check staging JWT secret
        env:
          JWT_SECRET_STAGING: ${{ secrets.JWT_SECRET_STAGING }}
          JWT_SECRET_PROD: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET_STAGING" ]; then
            echo "::error::JWT_SECRET_STAGING 시크릿이 비어 있다. Settings > Secrets 에 dev 전용 키를 등록해야 한다."
            exit 1
          fi
          if [ "$JWT_SECRET_STAGING" = "$JWT_SECRET_PROD" ]; then
            echo "::error::JWT_SECRET_STAGING 이 prod 의 JWT_SECRET 과 같다. dev 전용 키로 바꿔야 한다."
            exit 1
          fi

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=develop-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application-staging.properties
        run: |
          cat > src/main/resources/application-staging.properties << 'EOF'
          spring.datasource.url=${DB_URL}
          spring.datasource.username=${DB_USERNAME}
          spring.datasource.password=${DB_PASSWORD}
          spring.datasource.driver-class-name=org.postgresql.Driver

          spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
          spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
          spring.security.oauth2.client.registration.kakao.redirect-uri=https://bbang-ggut.site/api/v1/oauth2/kakao
          spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
          spring.security.oauth2.client.registration.kakao.client-name=Kakao
          spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
          spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
          spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
          spring.security.oauth2.client.provider.kakao.user-name-attribute=id

          spring.security.oauth2.client.registration.naver.client-id=${NAVER_LOGIN_CLIENT_ID}
          spring.security.oauth2.client.registration.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET}
          spring.security.oauth2.client.registration.naver.redirect-uri=https://bbang-ggut.site/api/v1/oauth2/naver
          spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
          spring.security.oauth2.client.registration.naver.client-name=Naver
          spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post

          spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
          spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
          spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
          spring.security.oauth2.client.provider.naver.user-name-attribute=response

          kakao.api.base-url=https://dapi.kakao.com
          kakao.api.key=${KAKAO_API_KEY}

          google.places.api-key=${GOOGLE_PLACES_API_KEY}

          gemini.api.key=${GEMINI_API_KEY}

          # 이유 문장 LLM 실험(#662) — 없으면 그 벤더만 실험에서 빠진다
          openai.api.key=${OPENAI_API_KEY:}
          anthropic.api.key=${CLAUDE_API_KEY:}

          # 취향 점수를 무엇으로 낼지 (#783) — AXIS 는 4축 코사인, LABEL 은 라벨 아홉 값 코사인.
          # Repository variables 의 STAGING_TASTE_SOURCE 로 켜고 끈다(Secrets 아님 — 숨길 값이 아니고,
          # Secret 으로 넣으면 배포 로그에서 ***로 가려져 어느 쪽으로 떴는지 확인할 수 없다).
          # 변수가 없으면 AXIS 라, 지워져도 기존 동작으로 돌아간다.
          #
          # 켜기 전에 가게 라벨 적재와 프로필 배치가 끝나 있어야 한다. 라벨 없는 회원에게 켜면 취향 항이
          # 0 이 되어 전원이 인기순으로 같은 코스를 받는다(개발 확인: 회원 105/109 가 라벨 보유, 97가지).
          recommendation.score.taste-source=${{ vars.STAGING_TASTE_SOURCE || 'AXIS' }}

          # 앱에서 눌러 이유 문장을 받아 본다 (#764). 스테이징에서만 켠다 — 운영은 프롬프트를 깎고 나서.
          # 하루 상한 200 은 메뉴 분류와 나눠 쓰는 무료 등급(500)의 몫이다.
          recommendation.reason.llm.enabled=true

          # 2026-09-09 정지 — prod 와 같은 무료 티어 키를 쓴다. dev 서버까지 스케줄러를 돌리면
          # 하루 500 요청을 둘이 나눠 먹어 양쪽 다 429 를 맞는다. 애초에 dev 에서 68만 건을
          # 분류할 일이 없으므로 여기는 계속 꺼 둔다 (분류 코드를 고칠 때만 잠시 켠다).
          menu.classification.enabled=false

          jwt.secret=${JWT_SECRET}
          jwt.access-token-expiry=1800000
          jwt.refresh-token-expiry=5184000000

          firebase.config.path=firebase/firebase-service-account.json

          oauth2.front-redirect-uri=bbanggut://permission-location

          # 월간 초안만 자동 생성. 발행·푸시는 어드민 검토 후 승인한다.
          monthly-report.auto-preparation.enabled=${{ vars.STAGING_MONTHLY_REPORT_AUTO_PREPARATION || 'false' }}
          monthly-report.auto-preparation.asset-version=${{ vars.STAGING_MONTHLY_REPORT_ASSET_VERSION || '' }}

          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          spring.jpa.properties.hibernate.format_sql=false
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

          logging.level.org.springframework.web=INFO
          logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
          logging.level.org.hibernate.type.descriptor.sql=INFO

          spring.flyway.enabled=true
          spring.flyway.locations=classpath:db/migration,classpath:db/seed/staging
          spring.flyway.baseline-on-migrate=true
          spring.flyway.baseline-version=20260609000000
          spring.flyway.baseline-description=Existing schema before nationwide ranking tables
          spring.flyway.out-of-order=true
          
          aws.region=ap-northeast-2
          aws.s3.bucket=${{ secrets.STAGING_AWS_S3_BUCKET }}


          springdoc.swagger-ui.enabled=true
          springdoc.api-docs.enabled=true
          swagger.server-url=https://bbang-ggut.site
          swagger.server-description=Staging

          # AES-256 암호화 키
          encrypt.secret-key=${ENCRYPT_SECRET_KEY}

          # Slack 웹훅
          slack.webhook.url=${SLACK_ERROR_WEBHOOK_URL}
          slack.notification.report-webhook-url=${SLACK_REPORT_WEBHOOK_URL}
          slack.notification.abuse-webhook-url=${SLACK_ABUSE_WEBHOOK_URL}
          slack.notification.letter-webhook-url=${SLACK_LETTER_WEBHOOK_URL}
          slack.notification.title-prefix=[DEV]

          # Lambda 콜백 인증 키
          lambda.callback.secret-key=${{secrets.LAMBDA_CALLBACK_SECRET_KEY}}

          # 성능 측정 대시보드
          # 게스트 쓰기 차단 — 새 앱 출시 뒤에 GUEST_WRITE_BLOCKED=true 로 켠다
          guest.write-blocked=${GUEST_WRITE_BLOCKED:false}
          # 준비된 첫 기록은 개발 앱에서 실제 저장까지 검증한다. 운영은 기본 비활성 유지.
          tutorial.enabled=true
          # 리워드: 이 시각(한국 시간) 전에 가입한 회원은 1.x 사용자로 보고 이관 선물을, 뒤에 가입한 회원은 환영 선물을 준다.
          # 값이 없으면 모두 1.x 사용자로 본다. 개발 서버는 새 회원 흐름을 볼 수 있게 과거 시각을 둔다 — 운영은 2.0 출시 시각을 넣는다.
          reward.carry-over-before=2026-10-13T00:00:00

          perf.dashboard.enabled=${PERF_DASHBOARD_ENABLED:false}
          perf.dashboard.access-key=${PERF_DASHBOARD_ACCESS_KEY:}
          EOF

      - name: Create Firebase service account file
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources/firebase
          echo "$FIREBASE_JSON" > src/main/resources/firebase/firebase-service-account.json

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bbang-ggut-be:develop-latest

      - name: Upload docker-compose to Staging EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_KEY }}
          source: docker-compose.yml,docker-compose.scouter.yml
          target: ~/app
          proxy_host: ${{ secrets.STAGING_BASTION_HOST }}
          proxy_username: ${{ secrets.STAGING_BASTION_USER }}
          proxy_key: ${{ secrets.STAGING_BASTION_KEY }}

      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_KEY }}
          proxy_host: ${{ secrets.STAGING_BASTION_HOST }}
          proxy_username: ${{ secrets.STAGING_BASTION_USER }}
          proxy_key: ${{ secrets.STAGING_BASTION_KEY }}
          script: |
            # pull/up 실패가 조용히 넘어가면(디스크 풀 등) 옛 컨테이너가 그대로 돌면서 워크플로만 초록이 된다.
            set -e
            cd ~/app

            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}" >> .env
            echo "SPRING_PROFILE=staging" >> .env
            echo "DB_URL=${{ secrets.STAGING_DB_URL }}" >> .env
            echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}" >> .env
            echo "KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }}" >> .env
            echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
            echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
            echo "NAVER_LOGIN_CLIENT_ID=${{ secrets.NAVER_LOGIN_CLIENT_ID }}" >> .env
            echo "NAVER_LOGIN_CLIENT_SECRET=${{ secrets.NAVER_LOGIN_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> .env
            echo "AWS_REGION=ap-northeast-2" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.STAGING_AWS_S3_BUCKET }}" >> .env
            echo "ENCRYPT_SECRET_KEY=${{ secrets.ENCRYPT_SECRET_KEY }}" >> .env
            echo "SLACK_ERROR_WEBHOOK_URL=${{ secrets.SLACK_ERROR_WEBHOOK_URL_DEV }}" >> .env
            echo "SLACK_REPORT_WEBHOOK_URL=${{ secrets.SLACK_REPORT_WEBHOOK_URL_DEV }}" >> .env
            echo "SLACK_ABUSE_WEBHOOK_URL=${{ secrets.SLACK_ABUSE_WEBHOOK_URL_DEV }}" >> .env
            echo "SLACK_LETTER_WEBHOOK_URL=${{ secrets.SLACK_LETTER_WEBHOOK_URL_DEV }}" >> .env
            echo "LAMBDA_CALLBACK_SECRET_KEY=${{ secrets.LAMBDA_CALLBACK_SECRET_KEY }}" >> .env
            echo "PERF_DASHBOARD_ENABLED=true" >> .env
            echo "PERF_DASHBOARD_ACCESS_KEY=${{ secrets.PERF_DASHBOARD_ACCESS_KEY }}" >> .env
            echo "ADMIN_API_KEY=${{ secrets.STAGING_ADMIN_API_KEY }}" >> .env
            echo "REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}" >> .env
            # 자동완성 Redis 캐시 스위치 — 저장소 변수로 켠다(없으면 꺼짐, 매번 DB)
            echo "AUTOCOMPLETE_CACHE_ENABLED=${{ vars.STAGING_AUTOCOMPLETE_CACHE_ENABLED || 'false' }}" >> .env
            echo "TRENDING_ENABLED=${{ vars.STAGING_TRENDING_ENABLED || 'false' }}" >> .env
            echo "SCOUTER_OBJ_NAME=bbang-staging" >> .env
            echo "SCOUTER_SERVER_PORT=6100" >> .env
            echo "SCOUTER_WEB_PORT=6188" >> .env

            # 정리를 pull 앞에 둔다 — 디스크가 찬 뒤에는 pull 이 "no space left on device" 로 먼저 죽고,
            # set -e 가 스크립트를 끊어 아래 prune 까지 오지 못한다. 공간을 비워줄 명령이 공간을 필요로
            # 하는 명령 뒤에 있는 교착이었다 (2026-09-08 배포 실패).
            docker image prune -af --filter "until=72h" || true

            # 하루에 여러 번 배포하면 72h 필터로는 하나도 안 지워진다. 그때는 롤백용 이미지까지 비운다 —
            # 지금 도는 컨테이너가 쓰는 이미지는 prune 대상이 아니라, 최악이어도 롤백 편의만 잃는다.
            AVAILABLE_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            echo "여유 공간 ${AVAILABLE_MB}MB"
            if [ "$AVAILABLE_MB" -lt 2048 ]; then
              echo "2GB 미만 — 롤백용 이미지까지 정리한다"
              docker image prune -af || true
              df -h /
            fi

            # 레이어 다운로드의 일시 오류는 재시도하되, 실패한 이미지로 up을 실행하지 않는다.
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.yml -f docker-compose.scouter.yml pull; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Docker 이미지 다운로드가 3회 실패했습니다. 기존 컨테이너를 유지합니다."
                exit 1
              fi
              sleep $((attempt * 5))
            done
            docker compose -f docker-compose.yml -f docker-compose.scouter.yml up -d
            # 배포 뒤 한 번 더 — 방금 밀려난 이미지를 다음 배포까지 안고 가지 않게.
            # 직전 버전 이미지는 남긴다 — 롤백 시 IMAGE_TAG만 되돌리면 되도록.
            # -a: 태그가 붙어 있어도 안 쓰는 이미지는 지운다 — 배포마다 태그가 새로 붙어 dangling이 아니라
            # 종전 prune으로는 하나도 안 지워졌고, 스테이징 디스크(6.7G)가 11개 이미지로 꽉 차 pull이 실패했다(2026-08-17).
            docker image prune -af --filter "until=72h"

      - name: Get PR title
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 실패(권한 403 등) 시 에러 본문이 제목에 섞이지 않도록 성공했을 때만 채택한다
          if ! PR_TITLE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""' 2>/dev/null); then
            PR_TITLE=""
          fi
          if [ -z "$PR_TITLE" ]; then
            # 머지 커밋 메시지는 여러 줄 — 첫 줄만 제목으로 쓴다 (GITHUB_OUTPUT 형식 보호)
            PR_TITLE=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n 1)
          fi
          {
            echo "title<<PR_TITLE_EOF"
            printf '%s\n' "$PR_TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: success()
        env:
          # 쉘 인라인(${{ }}) 주입 금지 — 제목의 따옴표·특수문자가 jq 명령을 깨뜨린다 (env 경유가 안전)
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_DEV }}
        run: |
          RESPONSE=$(jq -n \
            --arg pr "$PR_TITLE" \
            --arg tag "$IMAGE_TAG" \
            '{attachments: [{
              "color": "#58B9FF",
              "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": "🚀 배포 완료 [STAGING]", "emoji": true}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*PR*\n\($pr)"},
                  {"type": "mrkdwn", "text": "*Image Tag*\n\($tag)"},
                  {"type": "mrkdwn", "text": "*Branch*\ndev"}
                ]}
              ]
            }]}' | \
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-)
          # 웹훅 정상 응답은 "ok" — 아니면 로그에 경고를 남긴다 (배포는 이미 성공이므로 잡은 실패시키지 않음)
          if [ "$RESPONSE" != "ok" ]; then
            echo "::warning::Slack 배포 알림 실패: $RESPONSE"
          fi
