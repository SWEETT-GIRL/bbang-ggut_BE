spring.application.name=Croissant
spring.profiles.active=local

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
discord.notification.report-webhook-url=${DISCORD_REPORT_WEBHOOK_URL:}
discord.notification.abuse-webhook-url=${DISCORD_ABUSE_WEBHOOK_URL:}
discord.notification.enabled=${DISCORD_NOTIFICATION_ENABLED:true}

# Swagger
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260604.0
spring.flyway.baseline-description=Existing schema before Flyway
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

spring.jackson.time-zone=Asia/Seoul

# Naver enrich (Python crawler subprocess)
naver.crawler.python=python3
naver.crawler.script=scripts/naver_menu_scraper.py
naver.crawler.backend-url=http://localhost:8080
naver.crawler.single-timeout-seconds=180
naver.crawler.bulk-batch=50

# Naver search API
naver.search.base-url=https://openapi.naver.com
naver.search.client-id=${NAVER_CLIENT_ID:}
naver.search.client-secret=${NAVER_CLIENT_SECRET:}

# OpenSearch
opensearch.stores-index=stores
