spring.application.name=Croissant
spring.profiles.active=local
# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Actuator & Metrics
# 운영 지표는 공개 API(8080)와 분리된 관리 포트로만 노출한다.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Prometheus에서 지연 분위수를 계산할 수 있도록 히스토그램 버킷을 생성한다.
# 시계열 폭증을 막기 위해 버킷 범위를 10ms~10s로 제한한다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
# @Timed(histogram = true) 지표도 동일하게 버킷 범위를 제한한다.
management.metrics.distribution.minimum-expected-value.external.api=10ms
management.metrics.distribution.maximum-expected-value.external.api=10s
management.metrics.distribution.minimum-expected-value.search.engine.query=1ms
management.metrics.distribution.maximum-expected-value.search.engine.query=5s
management.metrics.distribution.minimum-expected-value.aws.s3=10ms
management.metrics.distribution.maximum-expected-value.aws.s3=30s
# Tomcat 스레드풀 지표(tomcat_threads_busy/current)는 MBean 레지스트리가 켜져야 노출된다.
server.tomcat.mbeanregistry.enabled=true
# 기동 완료(ApplicationReadyEvent) 이후에만 UP이 되는 readiness 프로브.
# 배포 파이프라인이 /actuator/health/readiness로 트래픽 투입 시점을 판단한다.
management.endpoint.health.probes.enabled=true
# Graceful shutdown — 배포로 컨테이너가 내려갈 때 진행 중인 요청을 마저 처리하고 종료한다.
# docker-compose의 stop_grace_period가 이 값보다 커야 SIGKILL로 잘리지 않는다.
server.shutdown=graceful
# 예약 작업(@Scheduled) 전체 스위치 — 기본은 켜짐. 같은 운영 데이터로 서버가 둘 뜨는 동안에는 한쪽을 끈다(SchedulerConfig).
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── Redis (자동완성 캐시). 캐시는 없어도 되는 기능이라 짧게 끊고 DB 로 물러난다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=300ms
# Redis 가 죽어도 앱은 정상이다 — 헬스가 DOWN 이 되면 배포가 readiness 에서 멈추므로 헬스 판정에서 뺀다.
management.health.redis.enabled=false
# 자동완성 Redis 캐시 스위치 — 인프라(Redis 컨테이너)가 뜬 환경에서만 켠다
store.search.autocomplete-cache.enabled=${AUTOCOMPLETE_CACHE_ENABLED:false}
# 자동완성 급부상·스테디 노출 스위치 — 켜면 신호를 Redis 에 쌓고, '한'처럼 짧은 검색어에서 뜨는 가게를 지역보다 위에 둔다
store.trending.enabled=${TRENDING_ENABLED:false}
# 빵투어 메모 초안 자동저장(Redis 버퍼 + STOMP).
# 초안 전용 Redis — course.draft.redis.mode(standalone | sentinel) 를 환경에서 주지 않으면 버퍼·플러셔·API 전부 뜨지 않는다.
# 운영에는 아직 Redis 가 없다. 로컬에서 켜 보려면 application-local.properties 에 course.draft.redis.mode=standalone (database 로 캐시와 가른다).
# write-enabled: PUT memo-draft 를 받을지(상세 응답 draftEnabled = 이 값 && Redis 설정됨). flusher-enabled: 쓰기를 꺼도 남은 초안을 계속 비운다.
course.draft.write-enabled=${COURSE_DRAFT_WRITE_ENABLED:false}
course.draft.flusher-enabled=${COURSE_DRAFT_FLUSHER_ENABLED:true}
course.draft.redis.host=${COURSE_DRAFT_REDIS_HOST:localhost}
course.draft.redis.port=${COURSE_DRAFT_REDIS_PORT:6379}
course.draft.redis.database=${COURSE_DRAFT_REDIS_DATABASE:1}
course.draft.redis.password=${COURSE_DRAFT_REDIS_PASSWORD:}
course.draft.redis.sentinel-master=${COURSE_DRAFT_REDIS_SENTINEL_MASTER:draft}
course.draft.redis.sentinel-nodes=${COURSE_DRAFT_REDIS_SENTINEL_NODES:}
slack.notification.report-webhook-url=${SLACK_REPORT_WEBHOOK_URL:}
slack.notification.abuse-webhook-url=${SLACK_ABUSE_WEBHOOK_URL:}
slack.notification.letter-webhook-url=${SLACK_LETTER_WEBHOOK_URL:}
slack.notification.search-miss-webhook-url=${SLACK_SEARCH_MISS_WEBHOOK_URL:}
slack.notification.enabled=${SLACK_NOTIFICATION_ENABLED:true}
# 5xx 슬랙 알림 — 운영 CD 가 true 로 켠다. 같은 오류(예외 클래스+터진 자리)는 cooldown 에 한 번만 보낸다
ops.alert.server-error.enabled=false
ops.alert.server-error.webhook-url=${slack.webhook.url:}
ops.alert.server-error.cooldown=5m
# 로그인 전 API IP 당 횟수 제한(메모리) — window 동안 묶음별 허용 수, 0 이면 그 묶음은 안 막는다. 테스트는 꺼져 있다
ops.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
ops.rate-limit.window=1m
# 한국 통신사는 CGNAT 로 한 IP 를 여러 사람이 같이 쓴다 — 사람 1명 기준이 아니라 공유 IP 기준으로 넉넉히(남용만 막는 선)
ops.rate-limit.guest-token=100
ops.rate-limit.auth-login=100
ops.rate-limit.auth-refresh=300
ops.rate-limit.store-search=600
ops.rate-limit.store-autocomplete=1500
# 탈퇴 회원 개인 정보 정리 — 탈퇴 즉시 지우고, days 지난 회원에 남은 값은 매일 cron 에 한 번 더 지운다(행·FK·providerId 해시는 남긴다)
member.withdrawal-retention.days=30
# 신고 · 제재 · 차단 기록은 탈퇴 후 1년 보관(개인정보처리방침과 같은 숫자)
member.withdrawal-retention.moderation-days=365
member.withdrawal-retention.cron=0 40 4 * * *
image.callback.secret-key=${IMAGE_CALLBACK_SECRET_KEY:}
# 관리자 API 열쇠(AdminApiKeyFilter, 헤더 X-Admin-Key). 비어 있으면 필터가 통과시키고 경고만 찍는다 — 서버에서는 반드시 채운다
admin.api-key=${ADMIN_API_KEY:}
# 슬랙 신고 알림의 어드민 링크. 비어 있으면 링크 없이 보낸다
admin.web-base-url=${ADMIN_WEB_BASE_URL:}
# 어드민 감사 로그(admin_audit_logs) — 쓰기·회원 조회를 남기고 retention-days 지난 줄은 매일 지운다. key-label 이 비면 열쇠 해시 앞 8자리
admin.audit.enabled=true
admin.audit.key-label=${ADMIN_AUDIT_KEY_LABEL:}
admin.audit.retention-days=180

# 게스트 쓰기 차단 — 새 앱이 스토어에 깔린 뒤에 켠다
guest.write-blocked=${GUEST_WRITE_BLOCKED:false}
# dev 테스트 회원 로그인 키(local·staging 전용 컨트롤러, 비면 local 밖에서는 닫힘)
dev.test-login.key=${DEV_TEST_LOGIN_KEY:}
# Swagger
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# DB 커넥션 풀(HikariCP) — 풀이 비었을 때 기본 30초 대신 3초만 기다리고 실패한다(fail-fast).
# 9월 멈춤 에피소드(9/18·9/24·9/29)에서 Tomcat 200스레드가 커넥션 10개를 30초씩 기다리다 nginx 120초 뒤 504 로 터졌다.
# 3초 안에 못 받으면 500 으로 빨리 돌려주고(앱이 살아 있다는 신호), 10초 넘게 쥔 커넥션은 스택과 함께 경고를 남겨
# 멈춤의 원인(긴 트랜잭션·누수)을 찾는다. 풀 크기는 기본값 10 을 명시만 — hikaricp_connections_pending 을 보고 조정한다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 같은 모양의 UPDATE 를 묶어 보낸다 — 정류장 순서 변경·중간 삽입이 정류장 수의 2배만큼 UPDATE 를 낱개로 보내던 것. INSERT 는 IDENTITY 라 묶이지 않는다
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260604.0
spring.flyway.baseline-description=Existing schema before Flyway
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.jackson.time-zone=Asia/Seoul
# Multipart — 빵로그 사진 분석이 768px JPEG 를 최대 30장 싣는다(장당 200KB 안팎). 기본값(1MB/10MB)으로는 모자란다
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
# HTTP client 공통 기본값
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=3s
# Naver enrich (Python crawler subprocess)
naver.crawler.python=python3
naver.crawler.script=scripts/naver_menu_scraper.py
naver.crawler.backend-url=http://localhost:8080
naver.crawler.single-timeout-seconds=180
naver.crawler.bulk-batch=50
# Naver search API
naver.search.base-url=https://openapi.naver.com
naver.search.client-id=${NAVER_CLIENT_ID:}
naver.search.client-secret=${NAVER_CLIENT_SECRET:}

# ── 취향 기반 추천 (#660 · #661). 기본값은 RecommendationProperties · PersonalizationProperties 에 있고 여기선 덮어쓸 때만 적는다.
# recommendation.area.candidate-limit=15
# recommendation.area.default-store-count=4
# recommendation.area.min-store-count=1
# recommendation.area.max-store-count=6
# recommendation.anchor.ring-m=1000
# recommendation.anchor.max-radius-m=3000
# recommendation.anchor.ranking-size=30
# recommendation.anchor.page-size=9
# recommendation.score.cosine-weight=1.0 / tag-weight=0.5 / prior-weight=0.3 / kind-weight=0.35  (#661 점수식)
# recommendation.score.min-bakery-score=0.5 / taste-cosine-threshold=0.2 / min-taste-candidates=3
# recommendation.score.min-strong-stores-for-tag-reason=4  (회원 태그를 배지·이유 문장에 쓰는 데 필요한 강한 신호 가게 수)
# recommendation.score.store-notable-tag-above=0.6 / member-notable-tag-above[태그]=태그별  (태그 칩 · 이유 프롬프트 태그 나열의 문턱 — 회원·가게 값이 둘 다 넘어야 도드라진 태그)
# recommendation.score.center-axes=true  (축별 중심화 — center-taste/-texture/-filling/-vibe 는 전체 가게 축 평균)
# recommendation.score.exclude-recorded-stores=true / recorded-store-penalty=0.3  (기록한 가게: 뺀다 또는 점수를 깎는다)
# recommendation.score.prior.review-weight=0.4 / rating-weight=0.4 / popularity-weight=0.2
# recommendation.score.prior.review-cap=2300 / rating-shrink=10 / rating-mean=4.6 / rating-floor=3.5 / rating-ceil=5.0 / popularity-cap=4.3
# store.popularity.conversion-smoothing=10 / ranking-scale-quantile=0.95  (인기도 산식 #663 ③)
# store.search.popularity-factor=0.68  (검색 관련도의 인기도 배수 계수)
# personalization.strong-signal-stores-for-chips=3
# personalization.short-quiz-confidence=0.7
# personalization.full-quiz-confidence=0.9

# ── 이유 문장 LLM 실험 (#662). 키가 없는 벤더는 실험에서 자동으로 빠진다(호출 전에 "설정 안 됨"으로 걸린다).
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
anthropic.api.key=${CLAUDE_API_KEY:}
# 모델과 변형은 값 한 줄로 늘리고 줄인다 — '벤더:모델' 목록과 변형 목록의 곱이 조합이 된다.
# recommendation.reason-experiment.models=GEMINI:gemini-3.5-flash-lite,ANTHROPIC:claude-haiku-4-5-20251001,OPENAI:gpt-5.6-luna
# recommendation.reason-experiment.variants=A,D
# recommendation.reason-experiment.max-combinations=12 / max-output-tokens=800 / temperature=0.0
# openai.api.model=gpt-5.6-luna / openai.api.reasoning-effort=low  (none·low·medium·high·xhigh·max, 빈 값이면 안 보낸다)
# anthropic.api.model=claude-haiku-4-5-20251001 / anthropic.api.version=2023-06-01

# 실패 검색어 자동 판정 — 네이버 검색 API(naver.search.*)와 LLM 을 쓴다. 기본은 꺼짐.
# auto-apply-verdicts 가 비어 있으면 shadow mode: 판정·근거만 search_misses 에 기록하고 검색어 교정·처리 상태 변경은 하지 않는다.
search-miss.triage.enabled=${SEARCH_MISS_TRIAGE_ENABLED:false}
search-miss.triage.auto-apply-verdicts=${SEARCH_MISS_TRIAGE_AUTO_APPLY_VERDICTS:}
# 하루 한 번 새벽(KST). 04:00 은 interaction 적재 배치가 쓴다.
search-miss.triage.cron=${SEARCH_MISS_TRIAGE_CRON:0 0 6 * * *}
# LLM 키는 anthropic.api.key(CLAUDE_API_KEY) 를 그대로 쓴다. 코드·파일에 키를 적지 않는다.
search-miss.triage.model=${SEARCH_MISS_TRIAGE_MODEL:ANTHROPIC:claude-haiku-4-5-20251001}

# 팔로잉 새 빵로그 · 좋아요 푸시를 모았다가 한 번에 울리는 창(분)
push.batch.window-minutes=10
