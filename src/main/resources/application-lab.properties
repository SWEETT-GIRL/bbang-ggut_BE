# 로컬 랩 프로파일 — local 위에 얹어 쓴다: --spring.profiles.active=local,lab
#
# local 은 운영 RDS 터널(15432)을 바라보므로, 검색 실험·측정은 반드시 이 프로파일로 랩 PG(5432)에 붙는다.
# (docker-compose.lab-postgres.yml + scripts/lab/restore-lab.sh 로 만든 운영 덤프 복제본)
# 비밀값이 없으므로 git 에 추적한다. local 의 나머지 키(카카오·JWT 등)는 그대로 상속된다.
spring.datasource.url=jdbc:postgresql://localhost:5432/soboro
spring.datasource.username=sweetgirl
spring.datasource.password=soboro-lab

# 러너가 엔진 순수 시간 p50/p95/p99 를 actuator(/actuator/prometheus)에서 읽을 수 있게 백분위를 노출한다
management.metrics.distribution.percentiles.search.engine.query=0.5,0.95,0.99
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
