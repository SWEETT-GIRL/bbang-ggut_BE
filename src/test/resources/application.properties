spring.profiles.include=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# main 의 application.properties 를 가리므로 배치 설정은 같은 값을 둔다 — 테스트도 운영과 같은 페치·flush 로 돈다
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

firebase.config.path=firebase/firebase-service-account.json
google.places.api-key=test-google-places-key
gemini.api.key=test-gemini-key

jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000

encrypt.secret-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
oauth2.front-redirect-uri=bbanggut://test
lambda.callback.secret-key=test-lambda-secret

spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-client-secret
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
menu.classification.enabled=false
management.health.redis.enabled=false
shedlock.enabled=false
# 초안 Redis mode 가 빈 값인 환경(compose 가 ${VAR:-} 로 넘기는 경우) — 초안·소켓 빈이 하나도 떠서는 안 된다. write-enabled 가 켜져 있어도 draftEnabled 는 false
course.draft.redis.mode=
course.draft.write-enabled=true
