# 주 DB — 로컬 PostgreSQL (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:15433/dataops
spring.datasource.username=dataops
spring.datasource.password=dataops
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8090
# 운영 DB — .env 로 주입 (미설정 시 운영 조회 기능 비활성). 0~1단계: 읽기 전용 계정
dataops.prod-db.url=${PROD_DB_URL:}
dataops.prod-db.username=${PROD_DB_USERNAME:}
dataops.prod-db.password=${PROD_DB_PASSWORD:}
