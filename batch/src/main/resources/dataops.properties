spring.application.name=BbanggutDataops
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties]
# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# core 의존성으로 Redis 가 클래스패스에 있지만 dataops 는 쓰지 않는다 — 켜 두면 Python 이 보는 health 가 DOWN 이 된다
management.health.redis.enabled=false
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway
spring.flyway.validate-on-migrate=true
# 기본 위치(db/migration)에는 core 의 WAS 마이그레이션이 있다 — dataops 것만 읽는다
spring.flyway.locations=classpath:db/dataops-migration
spring.jackson.time-zone=Asia/Seoul
# Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# HTTP client 공통 기본값
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s
# 수집 판정층은 proposal 저장까지. 자동 반영은 아래 auto-apply의 별도 검증 경로를 사용한다.
dataops.reconcile.enabled=true
dataops.reconcile.mode=PROPOSAL_ONLY
# Default restart mode: collection and proposals only. Explicitly enable after reviewed rollout.
dataops.serving.write-enabled=false
# Live worker only: private writer, capture-scoped validation and durable results.
dataops.auto-apply.enabled=${DATAOPS_AUTO_APPLY_ENABLED:false}
# 배치 EC2 에서는 필수(X-Dataops-Key). 비어 있으면 검사하지 않는다 — 로컬(localhost) 세션용
dataops.api-key=${DATAOPS_API_KEY:}
# 법정동 해소 근거의 버전 (v3 P4-4) — scripts/bjd_reference.py REFERENCE_VERSION · scripts/region_resolver.py PROJECTION_VERSION 과
# 함께 올린다. 승인 게이트는 이 버전으로 만든 region_resolution 근거만 인정한다
dataops.region.reference-version=mois-stanregin-api-20260926
dataops.region.projection-version=app-3field-v2
