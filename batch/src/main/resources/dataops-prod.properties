# 기존 RDS 안의 별도 dataops database(public 스키마). 최초 이전: docs/dataops-cloud-cutover.md.
# 런타임에는 DDL 권한이 없다. 준비·업그레이드는 별도 dataops-migrate 명령으로 실행한다.
spring.datasource.url=${DATAOPS_DB_URL}
spring.datasource.username=${DATAOPS_DB_USERNAME}
spring.datasource.password=${DATAOPS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=false
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=8090
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# 운영(서빙) DB — 기본은 WAS 와 같은 계정(조회 전용 판정). 반영할 때만 쓰기 계정으로 바꿔 띄운다
dataops.prod-db.url=${DATAOPS_PROD_DB_URL:${DB_URL}}
dataops.prod-db.username=${DATAOPS_PROD_DB_USERNAME:${DB_USERNAME}}
dataops.prod-db.password=${DATAOPS_PROD_DB_PASSWORD:${DB_PASSWORD}}
dataops.api-key=${DATAOPS_API_KEY}
