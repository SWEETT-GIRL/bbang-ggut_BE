# 배치 EC2 — 운영 RDS 의 dataops 스키마를 주 DB 로 쓴다. 값은 Parameter Store(/sweetgirl/prod/v2/batch)에서 환경 변수로 들어온다.
spring.datasource.url=${DATAOPS_DB_URL}
spring.datasource.username=${DATAOPS_DB_USERNAME}
spring.datasource.password=${DATAOPS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.default-schema=dataops
spring.flyway.schemas=dataops
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=8090
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# 운영(서빙) DB — 기본은 WAS 와 같은 계정(조회 전용 판정). 반영할 때만 쓰기 계정으로 바꿔 띄운다
dataops.prod-db.url=${DATAOPS_PROD_DB_URL:${DB_URL}}
dataops.prod-db.username=${DATAOPS_PROD_DB_USERNAME:${DB_USERNAME}}
dataops.prod-db.password=${DATAOPS_PROD_DB_PASSWORD:${DB_PASSWORD}}
dataops.api-key=${DATAOPS_API_KEY}
