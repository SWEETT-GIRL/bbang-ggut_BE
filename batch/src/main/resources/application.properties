# 배치 EC2 — EventBridge 가 EC2 를 켜면 Lambda 가 SSM 으로 `--batch.job=<이름>` 을 넘겨 작업 하나를 실행하고 끝난다.
# 값은 EC2 가 Parameter Store(/sweetgirl/prod/v2/batch)에서 읽어 환경 변수로 넣는다. v1·v2 와 운영 DB 를 공유한다.
spring.application.name=CroissantBatch
# S3 등 프로필로 묶인 운영 빈을 켠다
spring.profiles.active=batch
# 작업 하나 실행하고 끝나는 프로세스라 웹 서버를 띄우지 않는다
spring.main.web-application-type=none

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
# 스키마 변경은 v1 배포가 맡는다 — 배치가 기동할 때마다 마이그레이션을 돌리지 않는다
spring.flyway.enabled=false
spring.jackson.time-zone=Asia/Seoul
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=3s

# 작업마다 기동하므로 기동 시 데이터 보정·시더는 끈다 (v2 API 와 같다)
app.startup-data-maintenance.enabled=false
# 같은 작업이 v1 WAS 의 cron 과 겹치면 한 곳에서만 돌도록 ShedLock 은 켠다(기본값)
shedlock.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=300ms

# 작업별 스위치 — 켜는 것은 Parameter Store 값으로 정한다
store.trending.enabled=${TRENDING_ENABLED:false}
search-miss.triage.enabled=${SEARCH_MISS_TRIAGE_ENABLED:false}
search-miss.triage.auto-apply-verdicts=${SEARCH_MISS_TRIAGE_AUTO_APPLY_VERDICTS:}
search-miss.triage.model=${SEARCH_MISS_TRIAGE_MODEL:ANTHROPIC:claude-haiku-4-5-20251001}
member.withdrawal-retention.days=30
admin.audit.enabled=true
admin.audit.retention-days=180

slack.webhook.url=${SLACK_ERROR_WEBHOOK_URL:}
slack.notification.report-webhook-url=${SLACK_REPORT_WEBHOOK_URL:}
slack.notification.abuse-webhook-url=${SLACK_ABUSE_WEBHOOK_URL:}
slack.notification.letter-webhook-url=${SLACK_LETTER_WEBHOOK_URL:}
slack.notification.search-miss-webhook-url=${SLACK_SEARCH_MISS_WEBHOOK_URL:}
slack.notification.enabled=${SLACK_NOTIFICATION_ENABLED:true}

kakao.api.base-url=https://dapi.kakao.com
kakao.api.key=${KAKAO_API_KEY:}
naver.search.base-url=https://openapi.naver.com
naver.search.client-id=${NAVER_CLIENT_ID:}
naver.search.client-secret=${NAVER_CLIENT_SECRET:}
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
anthropic.api.key=${CLAUDE_API_KEY:}

encrypt.secret-key=${ENCRYPT_SECRET_KEY}
aws.region=ap-northeast-2
aws.s3.bucket=${AWS_S3_BUCKET}
firebase.config.path=file:/run/secrets/firebase.json

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
# SSM Run Command 는 출력 앞 24KB 만 남긴다 — 저장소 스캔 INFO 수백 줄이 끝의 오류를 밀어내지 않게 줄인다
logging.level.org.springframework.data.repository.config=WARN
