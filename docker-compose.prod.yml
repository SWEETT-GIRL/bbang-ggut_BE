# prod 전용 compose. staging은 계속 docker-compose.yml을 쓴다.
#
# 한 서버에서 blue/green 두 스택을 동시에 띄우기 위해 compose 프로젝트 이름으로 격리한다.
#   docker compose -p bbang-blue  -f docker-compose.prod.yml up -d
#   docker compose -p bbang-green -f docker-compose.prod.yml up -d
#
# container_name을 두지 않는 이유: 두 색이 같은 이름을 쓸 수 없기 때문이다.
# 컨테이너 이름은 compose가 프로젝트명 기준으로 짓는다 (bbang-blue-app-1 형태).
#
# 포트는 색깔별로 .env에서 주입한다.
#   blue  → APP_HOST_PORT=8080  MGMT_HOST_PORT=8081
#   green → APP_HOST_PORT=8082  MGMT_HOST_PORT=8083
#
# 컨테이너 '내부' 포트는 색과 무관하게 8080(앱) / 8081(actuator) 고정이다.
# 앱 안에서 도는 네이버 크롤러 서브프로세스가 localhost:8080으로 콜백하기 때문에
# 내부 포트를 색깔별로 바꾸면 그 경로가 깨진다.
services:
  app:
    image: ${DOCKER_USERNAME}/bbang-ggut-be:${IMAGE_TAG:-latest}
    restart: always
    # graceful shutdown(20s)이 끝나기 전에 SIGKILL이 날아가지 않도록 여유를 둔다.
    stop_grace_period: 30s
    labels:
      com.bbang.color: ${COLOR}
    environment:
      TZ: Asia/Seoul
      # 힙 OOM 이 나면 덤프를 남기고 프로세스를 끝낸다 → restart: always 로 다시 뜬다.
      # 끝내지 않으면 OOM 뒤에도 프로세스가 살아서 500 만 내며 버틸 수 있다.
      # 덤프는 JVM 당 첫 OOM 에 한 번만 뜨고, 같은 이름(java_pid1.hprof)이 이미 있으면 새로 쓰지 않는다.
      # 그래서 색깔마다 최대 한 개(힙 크기만큼)만 쌓인다. 분석한 덤프는 옮기거나 지워야 다음 덤프가 남는다.
      # 컨테이너가 137(커널 OOM killer)로 죽는 경우는 JVM 이 손쓸 틈이 없어 덤프가 남지 않는다.
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps -XX:+ExitOnOutOfMemoryError ${OTEL_JAVA_AGENT_OPTION:-}"
      # 오텔 — OTEL_JAVA_AGENT_OPTION 이 비어 있으면 에이전트가 붙지 않아 아래 값은 읽히지 않는다.
      # 메트릭은 기존 Prometheus, 로그는 기존 수집을 쓰므로 trace 만 보낸다.
      OTEL_SERVICE_NAME: bbang-ggut-be
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${OTEL_ENVIRONMENT:-unknown}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_SAMPLER: parentbased_always_on
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      # 컨테이너 내부 관리 포트 — 호스트 매핑만 색깔별로 다르다.
      MANAGEMENT_PORT: 8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PROD_SERVER_IP: "https://bbang-ggut.cloud"
      STAGING_SERVER_IP: "https://bbang-ggut.site"
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      ENCRYPT_SECRET_KEY: ${ENCRYPT_SECRET_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_LOGIN_CLIENT_ID: ${NAVER_LOGIN_CLIENT_ID}
      NAVER_LOGIN_CLIENT_SECRET: ${NAVER_LOGIN_CLIENT_SECRET}
      SLACK_ERROR_WEBHOOK_URL: ${SLACK_ERROR_WEBHOOK_URL}
      SLACK_REPORT_WEBHOOK_URL: ${SLACK_REPORT_WEBHOOK_URL}
      SLACK_ABUSE_WEBHOOK_URL: ${SLACK_ABUSE_WEBHOOK_URL}
      SLACK_LETTER_WEBHOOK_URL: ${SLACK_LETTER_WEBHOOK_URL}
      SLACK_SEARCH_MISS_WEBHOOK_URL: ${SLACK_SEARCH_MISS_WEBHOOK_URL:-}
      IMAGE_CALLBACK_SECRET_KEY: ${IMAGE_CALLBACK_SECRET_KEY}
      # 이미지 저장소 — OCI Object Storage 를 S3 호환 API 로 쓴다. 주소를 비우면 AWS S3 로 붙는다.
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-false}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      # Redis — 같은 서버의 docker-compose.infra.yml 이 띄운다. 스위치는 기본 꺼짐(지금 운영과 같다).
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTOCOMPLETE_CACHE_ENABLED: ${AUTOCOMPLETE_CACHE_ENABLED:-false}
      # 예약 작업 전체 스위치. 기본값을 두지 않는다 — 비면 기동을 막아, 켤지 끌지를 반드시 정하게 한다.
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:?SCHEDULING_ENABLED 를 true 나 false 로 정해야 한다}
      TRENDING_ENABLED: ${TRENDING_ENABLED:-false}
      POSTHOG_API_KEY: ${PROD_POSTHOG_API_KEY}
      GUEST_WRITE_BLOCKED: ${GUEST_WRITE_BLOCKED:-false}
      PERF_DASHBOARD_ENABLED: ${PERF_DASHBOARD_ENABLED:-false}
      PERF_DASHBOARD_ACCESS_KEY: ${PERF_DASHBOARD_ACCESS_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      # 신고 슬랙 어드민 링크 바탕 주소(비면 링크 없음)
      ADMIN_WEB_BASE_URL: ${ADMIN_WEB_BASE_URL:-}

    ports:
      # 앞단 Nginx 가 같은 호스트에 있으므로 127.0.0.1 에만 연다.
      # Docker 가 여는 포트는 호스트 방화벽(iptables INPUT)을 거치지 않는다 — 주소를 빼면 인터넷에 그대로 열린다.
      - "127.0.0.1:${APP_HOST_PORT}:8080"
      # actuator 관리 포트 — 인증이 없으므로 서버 안에서만 본다.
      - "127.0.0.1:${MGMT_HOST_PORT}:8081"
    volumes:
      # 컨테이너가 교체되면 안의 파일은 사라지므로 호스트(~/app/dumps/<색>)에 남긴다.
      # 두 색 모두 pid 1 이라 파일 이름이 같아서 폴더를 색깔별로 나눈다.
      - ./dumps/${COLOR}:/app/dumps

# postgres · redis 는 docker-compose.infra.yml 이 띄우고 이 네트워크에 붙어 있다.
# 앱은 색깔(blue/green)마다 다른 compose 프로젝트라 기본 네트워크가 갈리므로, 공용 네트워크에 직접 붙인다.
networks:
  default:
    name: bbang-infra
    external: true
