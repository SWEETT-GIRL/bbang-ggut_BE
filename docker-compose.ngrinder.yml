version: '3.8'

# 사용법:
#   docker compose -f docker-compose.ngrinder.yml up -d
#   http://localhost:9090  (admin / admin)
#
# Agent는 웹 화면(admin → Download Agent)에서 받아 로컬 실행.

services:
  ngrinder-controller:
    image: ngrinder/controller:3.5.9
    container_name: ngrinder-controller
    restart: unless-stopped
    ports:
      - "9090:80"        # 웹 UI
      - "16001:16001"    # Agent 연결 포트
      - "12000-12009:12000-12009"  # Agent 통신 포트
    volumes:
      - ngrinder-data:/opt/ngrinder-controller
    networks:
      - ngrinder-net

volumes:
  ngrinder-data:

networks:
  ngrinder-net:
    driver: bridge
