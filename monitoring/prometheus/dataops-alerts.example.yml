# 최초 smoke 성공·일일 스케줄 활성화 후 도입. 등록한 scrape job 이름과 맞춘다.
# Alertmanager 전달 설정은 기존 운영 설정을 사용한다.
groups:
  - name: dataops-collection
    rules:
      - alert: DataOpsPushgatewayUnavailable
        expr: up{job="dataops-pushgateway"} == 0 or absent(up{job="dataops-pushgateway"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pushgateway 수집 실패 또는 scrape 대상 미등록"
      - alert: DataOpsDailyRefreshMissing
        expr: absent(bbang_dataops_workflow_last_success_timestamp_seconds{job="dataops-workflow",workflow="freshness-refresh"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "기존 가게 최신화의 실행 지표가 없음"
      - alert: DataOpsDailyRefreshStale
        expr: time() - bbang_dataops_workflow_last_success_timestamp_seconds{job="dataops-workflow",workflow="freshness-refresh"} > 36 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "기존 가게 최신화가 36시간 동안 완료되지 않음"
      - alert: DataOpsWorkflowUnresolved
        expr: (time() - bbang_dataops_workflow_last_start_timestamp_seconds{job="dataops-workflow"} > 8 * 3600) and on(job,workflow) (bbang_dataops_workflow_running{job="dataops-workflow"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "배치 종료 기록 미확정: SSM 로그·EC2 상태 확인 필요"
