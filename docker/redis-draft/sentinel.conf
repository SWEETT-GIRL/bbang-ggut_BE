# 초안 Redis Sentinel 템플릿 (docker-compose.draft-ha.yml 이 컨테이너마다 복사해 쓴다).
# 마스터 이름 draft · quorum 2 · 5초 무응답이면 down 판정 → 승격.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor draft redis-draft-master 6380 2
sentinel down-after-milliseconds draft 5000
sentinel failover-timeout draft 10000
sentinel parallel-syncs draft 1
